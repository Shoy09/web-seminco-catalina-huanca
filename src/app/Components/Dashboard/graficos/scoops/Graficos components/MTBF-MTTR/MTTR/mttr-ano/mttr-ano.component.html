<div class="card-wrapper">
  <div class="card-header"><span class="card-accent"></span><span class="card-title">MTTR por Año</span></div>
  @if (!tarjetas || tarjetas.length === 0) {
    <div class="empty-state"><span class="material-icons empty-icon">bar_chart</span><span class="empty-text">Sin datos para el período seleccionado</span></div>
  } @else {
    <div class="contenedor-rendimiento">
      <div class="gauge-card" *ngFor="let item of tarjetas" [attr.data-tooltip]="getTooltipText(item)">
        <div class="gauge-title">{{ item.titulo }}</div>
        <div class="gauge-container">
          <div class="gauge" [style.--value]="item.porcentaje" [style.--color]="item.color">
            <div class="gauge-center">{{ item.valor }}</div>
          </div>
        </div>
        <div class="gauge-subinfo">{{ item.unidad }}</div>
      </div>
    </div>
  }
</div>
