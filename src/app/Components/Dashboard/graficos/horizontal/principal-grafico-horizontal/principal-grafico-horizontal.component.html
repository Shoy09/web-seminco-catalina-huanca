<div class="space-y-3">

  <!-- ══════════════════════════════════════════════════════════
       BARRA DE CONTROL
  ══════════════════════════════════════════════════════════════ -->
  <section class="overflow-hidden rounded-2xl border border-border bg-surface shadow-sm">

    <div class="flex items-center justify-between bg-gradient-to-r from-secondary via-secondary-75 to-primary px-4 py-2.5 text-white">
      <div class="flex items-center gap-2">
        <span class="material-icons ic-header">analytics</span>
        <span class="text-sm font-bold tracking-tight">Perforación Horizontal</span>
        <span class="hidden text-xs text-white/50 sm:inline">— Dashboard de Indicadores</span>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn-header" (click)="Presentacion()">
          <span class="material-icons ic-sm">slideshow</span>
          Presentación
        </button>
        <button class="btn-header" (click)="toggleDataZoom()">
          <span class="material-icons ic-sm">zoom_in</span>
          {{ showZoom ? 'Ocultar zoom' : 'Zoom' }}
        </button>
        <button class="btn-header" (click)="generarPDF()">
          <span class="material-icons ic-sm">picture_as_pdf</span> PDF
        </button>
        <button class="btn-header" (click)="exportarExcel()">
    <span class="material-icons ic-sm">table_chart</span> Excel
  </button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 px-3 py-2">
      <div class="flex items-center gap-1.5">
        <label class="label-filtro">Desde</label>
        <input type="date" [(ngModel)]="fechaInicio" class="input-filtro" />
      </div>
      <div class="flex items-center gap-1.5">
        <label class="label-filtro">Hasta</label>
        <input type="date" [(ngModel)]="fechaFin" class="input-filtro" />
      </div>
      <div class="flex items-center gap-1.5">
        <label class="label-filtro">Turno</label>
        <select [(ngModel)]="turnoSeleccionado" class="input-filtro cursor-pointer">
          <option value="">Todos</option>
          <option value="DÍA">Día</option>
          <option value="NOCHE">Noche</option>
        </select>
      </div>
      <button (click)="aplicarFiltro()" class="btn-primary">
        <span class="material-icons ic-sm">filter_alt</span>
        Aplicar
      </button>
      <button (click)="quitarFiltro()" class="btn-ghost">
        <span class="material-icons ic-sm">close</span>
        Limpiar
      </button>
    </div>
  </section>

  <ng-container *ngIf="vistaPrincipal">

    <!-- ══ DISPONIBILIDAD ══════════════════════════════════════ -->
    <div class="seccion-header">
      <span class="material-icons ic-seccion">speed</span>
      <span>Disponibilidad</span>
    </div>
    <div class="graficos-grid">
      <app-disponibilidad-equipo  [data]="DataDisponibilidadPorEquipo"  data-page="1" />
      <app-disponibilidad-dia     [data]="DataDisponibilidadPorDia"     data-page="1" [showZoom]="showZoom" />
      <app-disponibilidad-semana  [data]="DataDisponibilidadPorSemana"  data-page="1" [showZoom]="showZoom" />
      <app-disponibilidad-mes     [data]="DataDisponibilidadPorMes"     data-page="1" [showZoom]="showZoom" />
      <app-disponibilidad-guardia [data]="DataDisponibilidadPorGuardia" data-page="1" />
      <app-pareto-disponibilidad  [data]="DataParetoDisponibilidadJumbos" data-page="1" />
    </div>

    <!-- ══ UTILIZACIÓN ═════════════════════════════════════════ -->
    <div class="seccion-header">
      <span class="material-icons ic-seccion">bar_chart</span>
      <span>Utilización</span>
    </div>
    <div class="graficos-grid">
      <app-utilizacion-equipo  [data]="DataUtilizacionPorEquipo"  data-page="1" />
      <app-utilizacion-dia-mes [data]="DataUtilizacionPorDia"     data-page="1" [showZoom]="showZoom" />
      <app-utilizacion-semana  [data]="DataUtilizacionPorSemana"  data-page="1" [showZoom]="showZoom" />
      <app-utilizacion-mes     [data]="DataUtilizacionPorMes"     data-page="1" [showZoom]="showZoom" />
      <app-utilizacion-guardia [data]="DataUtilizacionPorGuardia" data-page="1" />
      <app-pareto-utilizacion  [data]="DataParetoUtilizacionJumbos" data-page="1" />
    </div>

    <!-- ══ RENDIMIENTO ═════════════════════════════════════════ -->
    <div class="seccion-header">
      <span class="material-icons ic-seccion">trending_up</span>
      <span>Rendimiento</span>
    </div>
    <div class="graficos-grid">
      <app-rendimiento-equipo  [data]="DataRendimientoPorEquipo"  data-page="1" />
      <app-rendimiento-dia     [data]="DataRendimientoPorDia"     data-page="1" [showZoom]="showZoom" />
      <app-rendimiento-semana  [data]="DataRendimientoPorSemana"  data-page="1" [showZoom]="showZoom" />
      <app-rendimiento-mes     [data]="DataRendimientoPorMes"     data-page="1" [showZoom]="showZoom" />
      <app-rendimiento-guardia [data]="DataRendimientoPorGuardia" data-page="1" />
    </div>

    <!-- ══ MTBF / MTTR ═════════════════════════════════════════ -->
    <div class="seccion-header">
      <span class="material-icons ic-seccion">build_circle</span>
      <span>MTBF / MTTR</span>
    </div>
    <div class="graficos-grid">
      <app-mtbf-equipo   [data]="DataMTBFPorEquipo"  unidad="h" titulo="MTBF por Equipo" />
      <app-mttr-equipo   [data]="DataMTTRPorEquipo"  unidad="h" titulo="MTTR por Equipo" />
      <app-mtbf-semanas  [data]="DataMTBFPorSemana"  unidad="h" titulo="MTBF por Semana" />
      <app-mtbf-mes      [data]="DataMTBFPorMes"     unidad="h" titulo="MTBF por Mes" />
      <app-mtbf-ano      [data]="DataMTBFPorAnio"    unidad="h" titulo="MTBF por Año" />
      <app-mttr-semanas  [data]="DataMTTRPorSemana"  unidad="h" titulo="MTTR por Semana" />
      <app-mttr-mes      [data]="DataMTTRPorMes"     unidad="h" titulo="MTTR por Mes" />
      <app-mttr-ano      [data]="DataMTTRPorAnio"    unidad="h" titulo="MTTR por Año" />
    </div>

    <!-- ══ OPERADORES ══════════════════════════════════════════ -->
    <div class="seccion-header">
      <span class="material-icons ic-seccion">people</span>
      <span>Operadores</span>
    </div>
    <div class="graficos-grid">
      <app-ranking-operador-rendimiento
        [data]="DataRankingOperadorRendimiento"
        unidad="m/h"
        titulo="Ranking Rendimiento por Operador"
        class="col-span-full" />
      <app-ranking-operador-utilizacion
        [data]="DataRankingOperadorUtilizacion"
        titulo="Ranking Utilización por Operador"
        class="col-span-full" />
    </div>

  </ng-container>

  <!-- Vista Gantt alternativa -->
  <div class="graficos-grid" *ngIf="!vistaPrincipal">
    <app-scheduler [data]="ganttData" data-page="6" class="col-span-full"></app-scheduler>
  </div>

</div>

<!-- Overlay PDF -->
<div class="overlay" *ngIf="cargandoPDF">
  <div class="spinner"></div>
  <p>Generando PDF...</p>
</div>
