<div class="mb-5 rounded-2xl border border-border bg-surface p-4 shadow-sm">

  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-6">

    <!-- FECHA INICIO -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">
        Fecha inicio
      </label>

      <input
        pInputText
        type="date"
        [(ngModel)]="fechaInicio"
        class="w-full"
      />
    </div>

    <!-- FECHA FIN -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">
        Fecha fin
      </label>

      <input
        pInputText
        type="date"
        [(ngModel)]="fechaFin"
        class="w-full"
      />
    </div>

    <!-- TURNO -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">
        Turno
      </label>

      <p-select
        [options]="turnos"
        [(ngModel)]="turnoSeleccionado"
        optionLabel="label"
        optionValue="value"
        placeholder="Todos"
        styleClass="w-full"
        appendTo="body">
      </p-select>
    </div>

    <!-- BOTÓN APLICAR -->
    <div class="flex items-end">
      <button
        pButton
        type="button"
        label="Aplicar"
        icon="pi pi-filter"
        class="w-full !bg-secondary !border-secondary !text-white hover:!bg-secondary/90"
        (click)="aplicarFiltro()">
      </button>
    </div>

    <!-- BOTÓN QUITAR FILTRO -->
    <div class="flex items-end">
      <button
        pButton
        type="button"
        label="Quitar filtro"
        icon="pi pi-filter-slash"
        severity="secondary"
        outlined="true"
        class="w-full"
        (click)="quitarFiltro()">
      </button>
    </div>

    <!-- BOTÓN PRESENTACIÓN -->
    <div class="flex items-end">
      <button
        pButton
        type="button"
        label="Presentación"
        icon="pi pi-chart-bar"
        severity="success"
        class="w-full"
        (click)="Presentacion()">
      </button>
    </div>

  </div>

  <!-- BOTÓN ZOOM -->
  <div class="mt-4 flex justify-end">
    <button
      pButton
      type="button"
      [label]="showZoom ? 'Ocultar zoom' : 'Mostrar zoom'"
      [icon]="showZoom ? 'pi pi-eye-slash' : 'pi pi-search-plus'"
      severity="info"
      outlined="true"
      (click)="toggleDataZoom()">
    </button>
  </div>

</div>

<div class="graficos-container" *ngIf="vistaPrincipal">

  <app-disponibilidad-equipo [data]="DataDisponibilidadPorEquipo" data-page="1"/>
  <app-disponibilidad-dia [data]="DataDisponibilidadPorDia" data-page="1"  [showZoom]="showZoom"/>
  <app-disponibilidad-semana [data]="DataDisponibilidadPorSemana" data-page="1" [showZoom]="showZoom"/>
  <app-disponibilidad-mes [data]="DataDisponibilidadPorMes" data-page="1" [showZoom]="showZoom"/>

  <app-utilizacion-equipo [data]="DataUtilizacionPorEquipo" data-page="1"/>

  <app-utilizacion-dia-mes [data]="DataUtilizacionPorDia" data-page="1" [showZoom]="showZoom"/>
  <app-utilizacion-semana [data]="DataUtilizacionPorSemana" data-page="1" [showZoom]="showZoom"/>
  <app-utilizacion-mes [data]="DataUtilizacionPorMes" data-page="1" [showZoom]="showZoom"/>

  <app-rendimiento-equipo [data]="DataRendimientoPorEquipo" data-page="1" />

  <app-rendimiento-dia [data]="DataRendimientoPorDia" data-page="1" [showZoom]="showZoom"/>
  <app-rendimiento-semana [data]="DataRendimientoPorSemana" data-page="1" [showZoom]="showZoom"/>
  <app-rendimiento-mes [data]="DataRendimientoPorMes" data-page="1" [showZoom]="showZoom"/>

  <app-pareto-utilizacion  [data]="DataParetoUtilizacionJumbos" data-page="1" />
  <app-pareto-disponibilidad [data]="DataParetoDisponibilidadJumbos" data-page="1" />

  <app-disponibilidad-guardia [data]="DataDisponibilidadPorGuardia" data-page="1" />
  <app-utilizacion-guardia [data]="DataUtilizacionPorGuardia" data-page="1" />
  <app-rendimiento-guardia [data]="DataRendimientoPorGuardia" data-page="1" />

  <app-ranking-operador-rendimiento [data]="DataRankingOperadorRendimiento" unidad="m/h" titulo="RANKING RENDIMIENTO POR OPERADOR - JUMBOS" />

  <app-ranking-operador-utilizacion [data]="DataRankingOperadorUtilizacion" titulo="RANKING UTILIZACIÓN POR OPERADOR - JUMBOS" />

  <app-mtbf-equipo [data]="DataMTBFPorEquipo" unidad="h" titulo="MTBF POR EQUIPO - JUMBOS" />
  <app-mttr-equipo [data]="DataMTTRPorEquipo" unidad="h" titulo="MTTR POR EQUIPO - JUMBOS" />

  <app-mtbf-semanas [data]="DataMTBFPorSemana" unidad="h" titulo="MTBF POR SEMANA - JUMBOS" />
  <app-mtbf-mes [data]="DataMTBFPorMes" unidad="h" titulo="MTBF POR MES - JUMBOS" />
  <app-mtbf-ano [data]="DataMTBFPorAnio" unidad="h" titulo="MTBF POR AÑO - JUMBOS" />

  <app-mttr-semanas [data]="DataMTTRPorSemana" unidad="h" titulo="MTTR POR SEMANA - JUMBOS" />
  <app-mttr-mes [data]="DataMTTRPorMes" unidad="h" titulo="MTTR POR MES - JUMBOS" />
  <app-mttr-ano [data]="DataMTTRPorAnio" unidad="h" titulo="MTTR POR AÑO - JUMBOS" />


</div>

<div class="graficos-container" *ngIf="!vistaPrincipal">

<app-scheduler class="full-width" [data]="ganttData" data-page="6"></app-scheduler>
</div>

 

<div class="overlay" *ngIf="cargandoPDF">
  <div class="spinner"></div>
  <p>Generando PDF...</p>
</div>
