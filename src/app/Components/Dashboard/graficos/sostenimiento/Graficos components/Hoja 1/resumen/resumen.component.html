<div class="kpi-grid">

  <div class="kpi-card">
    <div class="kpi-icon" style="background:#EFF6FF;color:#1D4ED8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="7" width="20" height="14" rx="2"></rect>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
      </svg>
    </div>
    <div class="kpi-body">
      <span class="kpi-label">Equipos</span>
      <span class="kpi-value">{{ resumenData.conteoEquipos | number }}</span>
    </div>
    <div class="kpi-stripe" style="background:#1D4ED8"></div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon" style="background:#F0FDF4;color:#15803D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <path d="M12 22V12"></path><polyline points="9 10 12 8 15 10"></polyline>
      </svg>
    </div>
    <div class="kpi-body">
      <span class="kpi-label">Total Metros</span>
      <span class="kpi-value">{{ resumenData.totalMetros | number }}</span>
    </div>
    <div class="kpi-stripe" style="background:#15803D"></div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon" style="background:#FFF7ED;color:#C2410C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 3v18h18"></path>
        <path d="M18 17V9"></path><path d="M12 17V5"></path><path d="M6 17v-3"></path>
      </svg>
    </div>
    <div class="kpi-body">
      <span class="kpi-label">Labores Sostenidas</span>
      <span class="kpi-value">{{ resumenData.totalLaboresSostenidas | number }}</span>
    </div>
    <div class="kpi-stripe" style="background:#C2410C"></div>
  </div>

  <div class="kpi-card">
    <div class="kpi-icon" style="background:#FEF9C3;color:#A16207">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <div class="kpi-body">
      <span class="kpi-label">Pernos / Día</span>
      <span class="kpi-value">{{ resumenData.nPernoDia | number }}</span>
    </div>
    <div class="kpi-stripe" style="background:#A16207"></div>
  </div>

</div>
