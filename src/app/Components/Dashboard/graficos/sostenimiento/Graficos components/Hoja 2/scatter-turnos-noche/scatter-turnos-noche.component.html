<div class="card-wrapper">
  <div class="card-header">
    <span class="card-accent"></span>
    <span class="card-title">Scatter por Turnos — Noche</span>
  </div>
  @if (!chartOption || !chartOption['series']) {
    <div class="empty-state">
      <span class="material-icons empty-icon">bar_chart</span>
      <span class="empty-text">Sin datos para el período seleccionado</span>
    </div>
  } @else {
    <div echarts [options]="chartOption" (chartInit)="onChartInit($event)" class="chart" [autoResize]="true"></div>
  }
</div>
