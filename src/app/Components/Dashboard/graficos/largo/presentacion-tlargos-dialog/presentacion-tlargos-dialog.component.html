<div class="dialog-container" [class.fullscreen]="isFullscreen">

  <!-- ══ HEADER ════════════════════════════════════════════════ -->
  <div class="dialog-header">
    <div class="flex items-center gap-2">
      <span class="material-icons ic-header">analytics</span>
      <span class="dialog-title">Taladro Largo — Presentación</span>
    </div>
    <div class="header-actions">
      <!-- Badges de filtro -->
      <span class="info-badge">{{ data.turnoAplicado || 'Todos los turnos' }}</span>
      <span class="info-badge">{{ data.fechaInicio || '—' }} → {{ data.fechaFin || '—' }}</span>
      <span class="info-badge accent">{{ data.operaciones.length || 0 }} registros</span>
      <!-- Controles -->
      <button class="icon-btn" (click)="toggleFullscreen()" [title]="isFullscreen ? 'Salir pantalla completa' : 'Pantalla completa'">
        <span class="material-icons">{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</span>
      </button>
      <button class="icon-btn close" (click)="cerrar()">
        <span class="material-icons">close</span>
      </button>
    </div>
  </div>

  <!-- ══ NAV TABS ═══════════════════════════════════════════════ -->
  <div class="nav-tabs">
    <button
      class="nav-tab"
      [class.active]="hojaActual === 'hoja1'"
      (click)="cambiarHoja('hoja1')"
    >
      <span class="material-icons tab-icon">schedule</span>
      Horas
    </button>
  </div>

  <!-- ══ CONTENIDO ══════════════════════════════════════════════ -->
  <div class="hoja-content" *ngIf="hojaActual === 'hoja1'">

    <div class="content-grid">
      <app-metros-perforados-rango-hora
        [data]="DataMetrosPerforadosPorHora"
        [turno]="turnoAplicado"
        unidad="m"
        tituloGrafico="METROS PERFORADOS POR RANGO DE HORA"
        tituloTotalTipo="TOTAL POR TIPO DE PERFORACIÓN"
        tituloTotalEquipo="TOTAL POR EQUIPO"
        labelCategoria="tipo de perforación"
        labelEquipo="equipos"
        mensajeSinDatos="No hay datos disponibles">
      </app-metros-perforados-rango-hora>

      <app-tabla-metros-perforados-equipo
        [data]="DataMetrosPerforadosPorLaborYRangoHora"
        [turno]="turnoAplicado"
        unidad="m"
        titulo="METROS PERFORADOS POR LABOR Y RANGO DE HORA"
        labelTotalLabor="TOTAL x LABOR"
        labelTotalRango="Total x Hora"
        mensajeSinDatos="No hay datos disponibles">
      </app-tabla-metros-perforados-equipo>
    </div>

  </div>

  <!-- ══ FOOTER ═════════════════════════════════════════════════ -->
  <div class="dialog-footer">
    <button class="btn-cerrar" (click)="cerrar()">
      <span class="material-icons">close</span>
      Cerrar
    </button>
  </div>

</div>
