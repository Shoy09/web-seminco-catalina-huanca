<div class="dialog-container" [class.fullscreen]="isFullscreen">
  <!-- Header con información de filtros -->
  <div class="dialog-header">
    <h2>Dashboard de Operaciones</h2>
    <div class="header-buttons">
      <button
        class="fullscreen-btn"
        (click)="toggleFullscreen()"
        [title]="isFullscreen ? 'Salir pantalla completa' : 'Pantalla completa'"
      >
        {{ isFullscreen ? "🗗" : "🗖" }}
      </button>
      <button class="close-btn" (click)="cerrar()">✕</button>
    </div>
  </div>

  <div class="nav-bar">
    <!-- Filtros a la izquierda -->
    <div class="filtros-resumen">
      <span class="filtro-badge"
        >Turno: {{ data.turnoAplicado || "Todos" }}</span
      >
      <span class="filtro-badge"
        >Fecha Inicio: {{ data.fechaInicio || "Sin filtro" }}</span
      >
      <span class="filtro-badge"
        >Fecha Fin: {{ data.fechaFin || "Sin filtro" }}</span
      >
      <span class="filtro-badge"
        >Total Registros: {{ data.operaciones.length || 0 }}</span
      >
    </div>

    <!-- Botones a la derecha -->
    <div class="nav-buttons">
      <button
        class="nav-btn"
        [class.active]="hojaActual === 'hoja1'"
        (click)="cambiarHoja('hoja1')"
      >
        Horas
      </button>
      <button
        class="nav-btn"
        [class.active]="hojaActual === 'hoja2'"
        (click)="cambiarHoja('hoja2')"
      >
        Mineral
      </button>
      <button
        class="nav-btn"
        [class.active]="hojaActual === 'hoja3'"
        (click)="cambiarHoja('hoja3')"
      >
        Desmonte
      </button>
    </div>
  </div>

  <!-- CONTENIDO DE LAS HOJAS -->

  <div *ngIf="hojaActual === 'hoja1'" class="hoja-content">
    <div class="graficos-wrapper one-column-full">
      <div class="graph-card">
        <app-metros-perforados-rango-hora
          [data]="DataToneladasPorHora"
          [turno]="turnoAplicado"
          unidad="ton"
          tituloGrafico="TONELADAS POR RANGO DE HORA"
          tituloTotalTipo="📊 TOTAL POR MATERIAL"
          tituloTotalEquipo="🚚 TOTAL POR VOLQUETE"
          labelCategoria="material"
          labelEquipo="volquetes"
          mensajeSinDatos="No hay datos de toneladas por rango de hora disponibles"
          [mostrarLineaViajes]="true"
          labelTotalViajes="Total Viajes"
        >
        </app-metros-perforados-rango-hora>
      </div>
    </div>

    <!-- Tabla de Metros Perforados por Equipo y Rango de Hora (1 columna - alto completo) -->
    <div class="graficos-wrapper one-column-full">
      <div class="graph-card">
        <app-tabla-metros-perforados-equipo
          [data]="DataToneladasPorLaborYRangoHora"
          [turno]="turnoAplicado"
          unidad="ton"
          titulo="🚚 TONELADAS POR LABOR Y RANGO DE HORA"
          labelTotalLabor="TOTAL TON x LABOR"
          labelTotalRango="Total Ton x Hora"
          mensajeSinDatos="No hay datos de toneladas disponibles para el turno seleccionado"
        >
        </app-tabla-metros-perforados-equipo>
      </div>
    </div>
  </div>

  <div *ngIf="hojaActual === 'hoja2'" class="hoja-content">
  
  <!-- Gráfico de Toneladas por Rango de Hora (1 columna - alto completo) -->
  <div class="graficos-wrapper one-column-full">
    <div class="graph-card">
      <app-toneladas-rango-hora [data]="DataToneladasPorHora" [turno]="turnoAplicado" titulo='TONELADAS DE MINERAL POR RANGO DE HORA'/>
    </div>
  </div>

  <!-- Tabla de Toneladas por Equipo y Rango de Hora (1 columna - alto completo) -->
  <div class="graficos-wrapper one-column-full">
    <div class="graph-card">
      <app-tabla-toneladas-equipo
        [data]="DataToneladasPorLaborYRangoHora"
        [turno]="turnoAplicado"
        titulo="TONELADAS MINERAL POR LABOR Y RANGO DE HORA"
        materialFiltro="MINERAL">
      </app-tabla-toneladas-equipo>
    </div>
  </div>

</div>

<div *ngIf="hojaActual === 'hoja3'" class="hoja-content">
  
  <!-- Gráfico de Toneladas por Rango de Hora (1 columna - alto completo) -->
  <div class="graficos-wrapper one-column-full">
    <div class="graph-card">
      <app-toneladas-rango-hora [data]="DataToneladasPorHora" [turno]="turnoAplicado" titulo='TONELADAS DE DESMONTE POR RANGO DE HORA'/>
    </div>
  </div>

  <!-- Tabla de Toneladas por Equipo y Rango de Hora (1 columna - alto completo) -->
  <div class="graficos-wrapper one-column-full">
    <div class="graph-card">
      <app-tabla-toneladas-equipo
        [data]="DataToneladasPorLaborYRangoHora"
        [turno]="turnoAplicado"
        titulo="TONELADAS DESMONTE POR LABOR Y RANGO DE HORA"
        materialFiltro="DESMONTE">
      </app-tabla-toneladas-equipo>
    </div>
  </div>

</div>

  <!-- Footer con acciones -->
  <div class="dialog-footer">
    <button class="btn-secundario" (click)="cerrar()">Cerrar</button>
  </div>
</div>
