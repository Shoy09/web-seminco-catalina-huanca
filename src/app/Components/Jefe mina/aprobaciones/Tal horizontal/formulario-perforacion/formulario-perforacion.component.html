<!-- formulario-perforacion — Tal horizontal: ubicacion, taladros (OPERATIVO), barras (OPERATIVO), tipoPerforacion (OPERATIVO), observaciones -->
<div *ngIf="visible"
     class="fixed inset-0 z-[1000] flex items-center justify-center bg-black/50 p-2.5 overflow-hidden">
  <div class="bg-white w-[95%] max-w-[1200px] max-h-[90vh] flex flex-col rounded-2xl shadow-2xl
              animate-[modalIn_0.3s_ease-out] overflow-hidden">

    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-3 shrink-0
                bg-gradient-to-r from-[#2b6777] to-[#1a4b58] text-white border-b border-white/10">
      <div class="flex items-center gap-2.5">
        <i class="far fa-file-alt text-xl opacity-90"></i>
        <h1 class="text-lg font-semibold m-0 tracking-tight">Formulario de Perforación</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="bg-gradient-to-r from-[#8bc34a] to-[#6f9e37] text-white text-[10px] font-bold uppercase tracking-wide px-3 py-1 rounded-full shadow">✎ EDITABLE</span>
        <span *ngIf="estado" class="text-xs font-bold uppercase px-3 py-1 rounded-full"
              [ngClass]="{
                'bg-success/20 text-green-200':  estado === 'OPERATIVO',
                'bg-warning/20 text-yellow-200': estado === 'DEMORA',
                'bg-danger/20 text-red-200':     estado === 'MANTENIMIENTO',
                'bg-slate-400/30 text-slate-200': !['OPERATIVO','DEMORA','MANTENIMIENTO'].includes(estado)
              }">{{ estado }}</span>
      </div>
    </div>

    <!-- Error validación -->
    <div *ngIf="formularioInvalido"
         class="flex items-center gap-2 mx-6 mt-3 px-4 py-2 bg-red-50 border-l-4 border-red-500
                text-red-700 text-xs font-semibold rounded-lg shrink-0">
      <i class="fas fa-exclamation-triangle"></i>
      Complete los campos obligatorios de Ubicación (*).
    </div>

    <!-- Formulario con scroll -->
    <form class="flex-1 overflow-y-auto px-6 py-4 space-y-3
                 [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-slate-100
                 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-thumb]:bg-slate-300
                 [&::-webkit-scrollbar-thumb]:rounded-full">

      <!-- Ubicación (siempre) -->
      <fieldset class="border border-slate-200 rounded-xl px-4 py-3 bg-white">
        <legend class="inline-flex items-center gap-1.5 px-2 text-[13px] font-bold text-[#1f3b43] bg-white">
          <i class="fas fa-map-marker-alt text-[#2b6777] text-sm"></i> Ubicación
        </legend>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Nivel <span class="text-red-500">*</span></label>
            <input type="text" placeholder="Ej: 450" [(ngModel)]="datosPerforacion.ubicacion.nivel" name="nivel"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs text-slate-800 focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Tipo Labor <span class="text-red-500">*</span></label>
            <input type="text" placeholder="Ej: RAMPA, GALERIA" [(ngModel)]="datosPerforacion.ubicacion.tipoLabor" name="tipoLabor"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs text-slate-800 focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Labor <span class="text-red-500">*</span></label>
            <input type="text" placeholder="Nombre de la labor" [(ngModel)]="datosPerforacion.ubicacion.labor" name="labor"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs text-slate-800 focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Ala</label>
            <input type="text" placeholder="NORTE, SUR (opcional)" [(ngModel)]="datosPerforacion.ubicacion.ala" name="ala"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs text-slate-800 focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
        </div>
      </fieldset>

      <!-- Taladros (solo OPERATIVO) -->
      <fieldset *ngIf="mostrarCamposCompletos" class="border border-slate-200 rounded-xl px-4 py-3 bg-white">
        <legend class="inline-flex items-center gap-1.5 px-2 text-[13px] font-bold text-[#1f3b43] bg-white">
          <i class="fas fa-gripfire text-[#2b6777] text-sm"></i> Taladros
        </legend>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Producción</label>
            <input type="text" placeholder="N° taladros" [(ngModel)]="datosPerforacion.taladros.produccion" name="talProduccion"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Rimados</label>
            <input type="text" placeholder="N° taladros" [(ngModel)]="datosPerforacion.taladros.rimados" name="talRimados"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Alivio</label>
            <input type="text" placeholder="N° taladros" [(ngModel)]="datosPerforacion.taladros.alivio" name="talAlivio"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Repaso</label>
            <input type="text" placeholder="N° taladros" [(ngModel)]="datosPerforacion.taladros.repaso" name="talRepaso"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
        </div>
      </fieldset>

      <!-- Barras (solo OPERATIVO) -->
      <fieldset *ngIf="mostrarCamposCompletos" class="border border-slate-200 rounded-xl px-4 py-3 bg-white">
        <legend class="inline-flex items-center gap-1.5 px-2 text-[13px] font-bold text-[#1f3b43] bg-white">
          <i class="fas fa-chart-simple text-[#2b6777] text-sm"></i> Barras
        </legend>
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">Longitud (m)</label>
            <input type="text" placeholder="Ej: 5.0" [(ngModel)]="datosPerforacion.barras.longitud" name="longBarras"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-slate-700">N° Barras</label>
            <input type="text" placeholder="Ej: 10" [(ngModel)]="datosPerforacion.barras.nBarra" name="numBarras"
              class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs focus:outline-none focus:border-[#2b6777] transition-all"/>
          </div>
        </div>
      </fieldset>

      <!-- Tipo perforación (solo OPERATIVO) -->
      <fieldset *ngIf="mostrarCamposCompletos" class="border border-slate-200 rounded-xl px-4 py-3 bg-white">
        <legend class="inline-flex items-center gap-1.5 px-2 text-[13px] font-bold text-[#1f3b43] bg-white">
          <i class="fas fa-drill text-[#2b6777] text-sm"></i> Tipo de Perforación
        </legend>
        <div class="max-w-xs">
          <select [(ngModel)]="datosPerforacion.tipoPerforacion" name="tipoPerforacion"
            class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg bg-white text-xs text-slate-800 cursor-pointer focus:outline-none focus:border-[#2b6777] transition-all">
            <option value="" disabled>Seleccionar tipo</option>
            <option *ngFor="let tp of tiposPerforacion" [value]="tp">{{ tp }}</option>
          </select>
        </div>
      </fieldset>

      <!-- Observaciones (siempre) -->
      <fieldset class="border border-slate-200 rounded-xl px-4 py-3 bg-white">
        <legend class="inline-flex items-center gap-1.5 px-2 text-[13px] font-bold text-[#1f3b43] bg-white">
          <i class="fas fa-comment text-[#2b6777] text-sm"></i> Observaciones
        </legend>
        <textarea rows="3" placeholder="Observaciones adicionales..."
          [(ngModel)]="datosPerforacion.observaciones" name="observaciones"
          class="w-full px-3 py-2 border-[1.5px] border-slate-200 rounded-lg text-xs text-slate-800 bg-white
                 resize-y min-h-[60px] focus:outline-none focus:border-[#2b6777] transition-all font-[inherit]"></textarea>
      </fieldset>

    </form>

    <!-- Footer -->
    <div class="flex justify-end gap-3 px-6 py-3 border-t border-slate-100 bg-white shrink-0">
      <button type="button" (click)="cerrarFormPerforacion()"
        class="flex items-center gap-1.5 px-5 py-2 border-[1.5px] border-slate-200 rounded-lg text-xs font-semibold
               text-slate-600 bg-white hover:bg-slate-50 active:scale-95 transition-all cursor-pointer">
        <i class="fas fa-times"></i> Cancelar
      </button>
      <button type="button" (click)="guardarPerforacion()"
        class="flex items-center gap-1.5 px-6 py-2 border-0 rounded-lg text-xs font-semibold text-white
               bg-gradient-to-r from-[#2b6777] to-[#1f4e5c] shadow-sm
               hover:brightness-110 hover:-translate-y-0.5 active:scale-95 transition-all cursor-pointer">
        <i class="fas fa-save"></i> Guardar cambios
      </button>
    </div>

  </div>
</div>
