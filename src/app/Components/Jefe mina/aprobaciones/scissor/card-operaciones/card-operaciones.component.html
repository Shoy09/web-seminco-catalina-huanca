<div class="operation-fields">
<div class="operation-field"><label for="revision-fecha">Fecha</label><input id="revision-fecha" type="date" [(ngModel)]="formValues['fecha']" (ngModelChange)="onChange()"
         /></div>
<div class="operation-field"><label for="revision-turno">Turno</label><select id="revision-turno" [(ngModel)]="formValues['turno']" (ngModelChange)="onChange()"
         >
          <option *ngFor="let opt of getCampo('turno').options" [value]="opt">{{ opt }}</option>
        </select></div>
<div class="operation-field"><label for="revision-equipo">Equipo</label><select id="revision-equipo" [(ngModel)]="formValues['equipo']" (ngModelChange)="onChange()"
         >
          <option *ngFor="let opt of getCampo('equipo').options" [value]="opt">{{ opt }}</option>
        </select></div>
<div class="operation-field"><label for="revision-codigo">Código de equipo</label><select id="revision-codigo" [(ngModel)]="formValues['codigo']" (ngModelChange)="onChange()"
         >
          <option *ngFor="let opt of getCampo('codigo').options" [value]="opt">{{ opt }}</option>
        </select></div>
<div class="operation-field"><label for="revision-operador">Operador</label><input id="revision-operador" type="text" placeholder="Nombre operador"
          [(ngModel)]="formValues['operador']" (ngModelChange)="onChange()"
         /></div>
<div class="operation-field"><label for="revision-jefeGuardia">Jefe Guardia</label><select id="revision-jefeGuardia" [(ngModel)]="formValues['jefeGuardia']" (ngModelChange)="onChange()"
         >
          <option *ngFor="let opt of getCampo('jefeGuardia').options" [value]="opt">{{ opt }}</option>
        </select></div>
<div class="operation-field"><label for="revision-guardia">Guardia</label><select id="revision-guardia" [(ngModel)]="formValues['guardia']" (ngModelChange)="onChange()">
  <option *ngFor="let opt of getCampo('guardia').options" [value]="opt">{{ opt }}</option>
</select></div></div>
