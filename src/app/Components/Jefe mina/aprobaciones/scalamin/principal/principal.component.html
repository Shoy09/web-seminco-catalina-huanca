<div class="approval-page">
  <section *ngIf="loading" class="loading-panel" role="status"><span class="loading-ring" aria-hidden="true"></span><span>Cargando operación…</span></section>
  <section *ngIf="errorCarga && !loading" class="error-panel" role="alert"><i class="pi pi-exclamation-circle" aria-hidden="true"></i><p>{{ errorCarga }}</p><button type="button" (click)="obtenerOperacion()">Reintentar</button></section>
  <ng-container *ngIf="cardData && !loading && !errorCarga">
    <section class="review-panel" aria-label="Datos de la operación"><app-card-operaciones [data]="cardData" (dataChange)="onCardChange($event)" /></section>
    <section class="review-panel activities-panel" aria-labelledby="activities-title">
      <header class="panel-heading"><h2 id="activities-title">Actividades <span class="count-badge">{{ tablaData.length }}</span></h2><span class="table-hint">Estado, horario y detalle de desatado</span></header>
      <app-tabla [data]="tablaData" [turno]="cardData.turno" (dataChange)="onTablaChange($event)" />
    </section>
    <div class="actions-dock"><app-menuAcciones [horometrosData]="horometrosData" [condicionesData]="condicionesData" [checkListData]="checkListData" [llantasData]="llantasData" (dataChange)="onMenuChange($event)" (actualizarClick)="validarCambios()" /></div>
  </ng-container>
</div>
