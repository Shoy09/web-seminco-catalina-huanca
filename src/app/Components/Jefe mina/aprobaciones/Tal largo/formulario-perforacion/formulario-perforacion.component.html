<div class="modal-overlay perf-overlay" *ngIf="visible">
  <div class="modal-card perf-card">
    <div class="perf-header">
      <div class="header-left">
        <i class="far fa-file-alt header-icon"></i>
        <h1 class="header-title">Formulario de Perforación</h1>
      </div>
      <div class="header-right">
        <span class="editable-badge">• EDITABLE</span>
        <span class="estado-badge" [class]="estado.toLowerCase()">
          {{ estado }}
        </span>
      </div>
    </div>

    <div class="validation-error" *ngIf="formularioInvalido">
      <i class="fas fa-exclamation-triangle"></i>
      Complete los campos obligatorios: Labor y al menos una barra con longitud válida.
    </div>

    <form class="perf-form">
      <!-- SECCIÓN LABOR (siempre visible) -->
      <fieldset class="form-section">
        <legend class="section-legend">
          <i class="fas fa-warehouse icon"></i> Información de Labor
        </legend>
        <div class="row-inputs">
          <div class="input-field full-width">
            <label class="field-label">
              <i class="fas fa-warehouse label-icon"></i>
              Labor <span class="required-star">*</span>
            </label>
            <input
              type="text"
              class="perf-input"
              placeholder="Ej: TJ_2940_TL"
              [(ngModel)]="datosPerforacion.labor"
              name="labor"
            />
          </div>
        </div>
      </fieldset>

      <!-- SECCIÓN BARRAS DINÁMICA -->
      <fieldset class="form-section">
        <legend class="section-legend">
          <i class="fas fa-ruler-combined icon"></i> Barras de Perforación
          <span class="required-star">*</span>
        </legend>
        
        <div class="barras-header">
          <div class="header-cell">N° Fila</div>
          <div class="header-cell">N° Taladro</div>
          <div class="header-cell">Longitud de perforación (m)</div>
          <div class="header-cell">N° Barras</div>
          <div class="header-cell">Tipo de perforación</div>
          <div class="header-cell actions-header">Acciones</div>
        </div>
        
        <div class="barras-list">
          <div *ngFor="let barra of datosPerforacion.barras; let i = index" class="barra-fila">
            <div class="fila-cell">
              <input
                type="number"
                class="perf-input barra-input"
                placeholder="N° Fila"
                [(ngModel)]="barra.n_fila"
                [name]="'n_fila_' + i"
                min="0"
                step="1"
              />
            </div>
            
            <div class="fila-cell">
              <input
                type="number"
                class="perf-input barra-input"
                placeholder="N° Taladro"
                [(ngModel)]="barra.n_taladro"
                [name]="'n_taladro_' + i"
                min="0"
                step="1"
              />
            </div>
            
            <div class="fila-cell">
              <input
                type="number"
                step="0.1"
                class="perf-input barra-input"
                placeholder="Longitud (m)"
                [(ngModel)]="barra.longitud_perforacion"
                [name]="'longitud_' + i"
              />
            </div>
            
            <div class="fila-cell">
              <input
                type="number"
                class="perf-input barra-input"
                placeholder="N° Barras"
                [(ngModel)]="barra.n_barras"
                [name]="'n_barras_' + i"
                min="0"
                step="1"
              />
            </div>
            
            <div class="fila-cell">
              <select
                class="perf-select barra-select"
                [(ngModel)]="barra.tipo_perforacion"
                [name]="'tipo_' + i"
              >
                <option *ngFor="let tipo of tiposPerforacion" [value]="tipo">
                  {{ tipo }}
                </option>
              </select>
            </div>
            
            <div class="fila-cell actions-cell">
              <button
                type="button"
                class="btn-eliminar-barra"
                (click)="eliminarBarra(i)"
                [disabled]="datosPerforacion.barras.length === 1"
                title="Eliminar barra"
              >
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="agregar-barra-container">
          <button
            type="button"
            class="btn-agregar-barra"
            (click)="agregarBarra()"
          >
            <i class="fas fa-plus-circle"></i>
            Agregar Barra
          </button>
        </div>
      </fieldset>

      <!-- SECCIÓN OBSERVACIONES (siempre visible) -->
      <fieldset class="form-section">
        <legend class="section-legend">
          <i class="fas fa-comment icon"></i> Observaciones
        </legend>
        <div class="input-field textarea-field">
          <label class="field-label">
            <i class="fas fa-pen label-icon"></i>
            Observaciones adicionales
          </label>
          <textarea
            class="perf-input perf-textarea"
            rows="3"
            placeholder="Ingrese observaciones importantes sobre la perforación..."
            [(ngModel)]="datosPerforacion.observaciones"
            name="observaciones"
          ></textarea>
        </div>
      </fieldset>

      <!-- BOTONES -->
      <div class="perf-footer-actions">
        <button
          type="button"
          class="btn-cancelar"
          (click)="cerrarFormPerforacion()"
        >
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button
          type="button"
          class="btn-guardar"
          (click)="guardarPerforacion()"
        >
          <i class="fas fa-save"></i> Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
