<div class="activities-scroll" tabindex="0" aria-label="Actividades del turno, tabla con desplazamiento horizontal">
  <table class="activities-table">
    <thead><tr><th scope="col">N°</th><th scope="col">Estado de actividad</th><th scope="col">Código</th><th scope="col">Hora de inicio</th><th scope="col">Hora de fin</th><th scope="col" class="actions-column">Acciones</th></tr></thead>
    <tbody>
      <tr *ngFor="let item of datos">
        <td class="row-number">{{ item.nro }}</td>
        <td><span class="activity-status" [style.color]="item.color" [style.background-color]="item.color + '12'"><span></span>{{ item.estado }}</span></td>
        <td><span class="activity-code">{{ item.codigo }}</span></td>
        <td class="time-cell"><i class="pi pi-clock" aria-hidden="true"></i>{{ item.horaInicio }}</td>
        <td class="time-cell">{{ item.horaFin }}</td>
        <td><div class="row-actions">
          <button type="button" class="row-action" (click)="onEdit(item)" title="Editar estado y horario" [attr.aria-label]="'Editar estado y horario del registro ' + item.nro"><i class="pi pi-pencil" aria-hidden="true"></i></button>
          <button type="button" class="row-action detail-action" (click)="onExecute(item)" title="Detalle de perforación" [attr.aria-label]="'Abrir detalle de perforación del registro ' + item.nro"><i class="pi pi-file-edit" aria-hidden="true"></i><span>Detalle</span></button>
          <button type="button" class="row-action delete-action" (click)="onDelete(item)" title="Eliminar registro" [attr.aria-label]="'Eliminar registro ' + item.nro"><i class="pi pi-trash" aria-hidden="true"></i></button>
        </div></td>
      </tr>
    </tbody>
  </table>
</div>

<app-formulario-operacion
  [visible]="mostrarOperacion"
  [turno]="turno"
  [data]="operacionFormSeleccionada"
  (confirmar)="onConfirmarOperacion($event)"
  (cerrarForm)="mostrarOperacion = false">
</app-formulario-operacion>

<app-formulario-perforacion
  [visible]="mostrarPerforacion"
  [operacion]="operacionSeleccionada"
  [estado]="registroEnEdicion?.estado || ''"
  (guardar)="onGuardarPerforacion($event)"
  (cerrar)="mostrarPerforacion = false">
</app-formulario-perforacion>
