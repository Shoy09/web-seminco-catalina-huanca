<div class="operation-fields">
  <div class="operation-field"><label for="tl-fecha">Fecha</label>
    <input id="tl-fecha" type="date" [(ngModel)]="formValues['fecha']" (ngModelChange)="onChange()" />
  </div>
  <div class="operation-field"><label for="tl-turno">Turno</label>
    <select id="tl-turno" [(ngModel)]="formValues['turno']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('turno').options" [value]="opt">{{ opt }}</option></select>
  </div>
  <div class="operation-field"><label for="tl-equipo">Equipo</label>
    <select id="tl-equipo" [(ngModel)]="formValues['equipo']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('equipo').options" [value]="opt">{{ opt }}</option></select>
  </div>
  <div class="operation-field"><label for="tl-codigo">Código de equipo</label>
    <select id="tl-codigo" [(ngModel)]="formValues['codigo']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('codigo').options" [value]="opt">{{ opt }}</option></select>
  </div>
  <div class="operation-field"><label for="tl-modelo_equipo">Modelo</label>
    <select id="tl-modelo_equipo" [(ngModel)]="formValues['modelo_equipo']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('modelo_equipo').options" [value]="opt">{{ opt }}</option></select>
  </div>
  <div class="operation-field"><label for="tl-operador">Operador</label>
    <input id="tl-operador" type="text" [(ngModel)]="formValues['operador']" (ngModelChange)="onChange()" />
  </div>
  <div class="operation-field"><label for="tl-jefeGuardia">Jefe de guardia</label>
    <select id="tl-jefeGuardia" [(ngModel)]="formValues['jefeGuardia']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('jefeGuardia').options" [value]="opt">{{ opt }}</option></select>
  </div>
  <div class="operation-field"><label for="tl-seccion">Sección</label>
    <select id="tl-seccion" [(ngModel)]="formValues['seccion']" (ngModelChange)="onChange()"><option *ngFor="let opt of getCampo('seccion').options" [value]="opt">{{ opt }}</option></select>
  </div>
</div>
