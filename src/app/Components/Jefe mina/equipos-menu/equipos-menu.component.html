<div class="equipment-page">
  <header class="page-heading">
    <span class="heading-icon"><i class="pi pi-sitemap" aria-hidden="true"></i></span>
    <div class="heading-copy"><h1>Operaciones por equipo</h1><p>Selecciona un proceso para revisar sus operaciones.</p></div>
    <span class="process-count"><strong>{{ equipos.length }}</strong> procesos</span>
  </header>

  <section class="equipment-panel" aria-labelledby="equipment-title">
    <div class="panel-heading"><h2 id="equipment-title">Procesos disponibles</h2><span>Jefe de mina</span></div>
    <nav class="equipment-grid" aria-label="Operaciones por proceso" *ngIf="equipos.length; else emptyState">
      <a *ngFor="let equipo of equipos" [routerLink]="equipo.ruta" class="equipment-card" [attr.aria-label]="'Ver operaciones de ' + equipo.nombre">
        <span class="equipment-icon"><i [class]="equipo.icono" aria-hidden="true"></i></span>
        <span class="equipment-name">{{ equipo.nombre | titlecase }}</span>
        <span class="equipment-arrow"><i class="pi pi-arrow-right" aria-hidden="true"></i></span>
      </a>
    </nav>
    <ng-template #emptyState><div class="empty-state"><i class="pi pi-inbox" aria-hidden="true"></i><strong>No hay procesos disponibles</strong><span>Los accesos aparecerán en esta sección.</span></div></ng-template>
  </section>
</div>
