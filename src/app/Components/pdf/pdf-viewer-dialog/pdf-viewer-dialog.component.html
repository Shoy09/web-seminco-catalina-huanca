<h2 mat-dialog-title class="flex items-center gap-2 text-lg font-semibold text-ink pb-1">
  <mat-icon class="!h-5 !w-5 !text-xl !leading-none text-secondary">picture_as_pdf</mat-icon>
  Vista Previa del PDF
</h2>

<mat-dialog-content class="!p-0 overflow-hidden">
  <iframe
    [src]="data.url | safeUrl"
    width="100%"
    height="600px"
    frameborder="0"
    class="block w-full rounded-b-xl">
  </iframe>
</mat-dialog-content>
