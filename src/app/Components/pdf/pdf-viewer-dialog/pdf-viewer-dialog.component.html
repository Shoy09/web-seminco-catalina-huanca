<div class="documents-dialog pdf-viewer"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-file-pdf" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Vista previa del PDF</h2><p>Consulta el documento seleccionado.</p></div><button type="button" class="icon-button" mat-dialog-close aria-label="Cerrar vista previa"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="viewer-body"><iframe [src]="data.url | safeUrl" title="Vista previa del documento PDF"></iframe></mat-dialog-content><footer class="dialog-actions"><span class="viewer-hint">¿No se muestra el archivo? Ábrelo en otra pestaña.</span><a class="ui-button" [href]="data.url" target="_blank" rel="noopener noreferrer"><i class="pi pi-external-link" aria-hidden="true"></i>Abrir PDF</a><button type="button" class="ui-button primary" mat-dialog-close>Cerrar</button></footer></div>
