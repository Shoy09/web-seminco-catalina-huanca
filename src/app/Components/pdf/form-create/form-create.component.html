<div class="documents-dialog" [attr.aria-busy]="loading"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-file-pdf" aria-hidden="true"></i></span><div><h2 mat-dialog-title>{{ modoEdicion ? 'Editar documento' : 'Subir documento' }}</h2><p>{{ data.carpetaNombre }}</p></div><button type="button" class="icon-button" (click)="cancelar()" [disabled]="loading" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><form [formGroup]="form" (ngSubmit)="onSubmit()" class="dialog-form"><div class="dialog-body"><fieldset class="upload-fields" [disabled]="loading"><div class="field"><label for="document-name">Nombre del documento <span class="required">*</span></label><input id="document-name" formControlName="nombre" placeholder="Ej. Reporte de operaciones" aria-describedby="document-name-error" /><p *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" id="document-name-error" class="field-error">Ingresa un nombre de al menos 3 caracteres.</p></div><div class="field"><label>{{ modoEdicion ? 'Reemplazar archivo PDF' : 'Archivo PDF' }}<span *ngIf="!modoEdicion" class="required"> *</span></label><input #pdfInput id="archivo" type="file" accept="application/pdf,.pdf" hidden (change)="onFileSelected($event)" /><button type="button" class="upload-area" (click)="pdfInput.click()" *ngIf="!pdfFile"><span class="upload-icon"><i class="pi pi-upload" aria-hidden="true"></i></span><strong>Seleccionar archivo PDF</strong><span>{{ modoEdicion ? 'Opcional: conserva el archivo actual si no eliges uno nuevo.' : 'Elige un documento desde tu dispositivo.' }}</span></button><div class="selected-file" *ngIf="pdfFile"><span class="pdf-icon"><i class="pi pi-file-pdf" aria-hidden="true"></i></span><div class="file-info"><strong [title]="pdfFile.name">{{ pdfFile.name }}</strong><span>Listo para subir</span></div><button type="button" class="icon-button danger" (click)="quitarArchivo(pdfInput)" aria-label="Quitar archivo seleccionado"><i class="pi pi-times" aria-hidden="true"></i></button></div><button *ngIf="pdfFile" type="button" class="text-action" (click)="pdfInput.click()">Seleccionar otro archivo</button><p *ngIf="form.get('archivo')?.touched && form.get('archivo')?.hasError('required')" class="field-error">Selecciona un archivo PDF.</p><p *ngIf="form.get('archivo')?.hasError('invalidType')" class="field-error" role="alert">El archivo debe ser un PDF válido.</p></div></fieldset><p *ngIf="errorMensaje" class="field-error status-message" role="alert">{{ errorMensaje }}</p></div><footer class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()" [disabled]="loading">Cancelar</button><button type="submit" class="ui-button primary" [disabled]="form.invalid || loading"><i class="pi" [ngClass]="loading ? 'pi-spin pi-spinner' : 'pi-check'" aria-hidden="true"></i>{{ loading ? 'Guardando…' : modoEdicion ? 'Guardar cambios' : 'Subir documento' }}</button></footer></form></div>
