<div class="documents-dialog" [attr.aria-busy]="loading"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-folder-plus" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Nueva carpeta</h2><p>Organiza los documentos por tema u operación.</p></div><button type="button" class="icon-button" (click)="cancelar()" [disabled]="loading" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><form [formGroup]="carpetaForm" (ngSubmit)="crearCarpeta()" class="dialog-form"><div class="dialog-body"><div class="field"><label for="folder-name">Nombre de la carpeta <span class="required">*</span></label><input id="folder-name" formControlName="nombre" placeholder="Ej. Procedimientos de operación" [readOnly]="loading" aria-describedby="folder-error" /><p *ngIf="carpetaForm.get('nombre')?.invalid && carpetaForm.get('nombre')?.touched" id="folder-error" class="field-error">Ingresa un nombre de al menos 3 caracteres.</p></div><p *ngIf="errorMensaje" class="field-error status-message" role="alert">{{ errorMensaje }}</p></div><footer class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()" [disabled]="loading">Cancelar</button><button type="submit" class="ui-button primary" [disabled]="carpetaForm.invalid || loading"><i class="pi" [ngClass]="loading ? 'pi-spin pi-spinner' : 'pi-check'" aria-hidden="true"></i>{{ loading ? 'Creando…' : 'Crear carpeta' }}</button></footer></form></div>
