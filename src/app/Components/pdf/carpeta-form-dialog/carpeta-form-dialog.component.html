<div class="w-full">

  <!-- Título -->
  <div class="flex items-center justify-between border-b border-border px-6 py-4">
    <div>
      <p class="text-[10px] font-bold uppercase tracking-widest text-ink-50">Nueva carpeta</p>
      <h2 class="text-lg font-black text-ink">Crear Carpeta</h2>
    </div>
    <button mat-icon-button (click)="cancelar()" class="!text-ink-50 hover:!text-danger">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Contenido -->
  <mat-dialog-content class="!p-6">
    <form [formGroup]="carpetaForm" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold uppercase tracking-wide text-ink-50">
          Nombre de la carpeta
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <input
            matInput
            formControlName="nombre"
            placeholder="Ej: Documentos 2026"
          />
          <mat-error *ngIf="carpetaForm.get('nombre')?.hasError('required')">
            El nombre es requerido
          </mat-error>
          <mat-error *ngIf="carpetaForm.get('nombre')?.hasError('minlength')">
            Mínimo 3 caracteres
          </mat-error>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <!-- Acciones -->
  <mat-dialog-actions align="end" class="!px-6 !pb-5 !pt-2 gap-2">
    <button mat-stroked-button (click)="cancelar()" class="!rounded-xl">
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="crearCarpeta()"
      [disabled]="carpetaForm.invalid || loading"
      class="!rounded-xl">
      <mat-icon class="!h-4 !w-4 !text-sm">{{ loading ? 'hourglass_empty' : 'create_new_folder' }}</mat-icon>
      {{ loading ? 'Creando...' : 'Crear Carpeta' }}
    </button>
  </mat-dialog-actions>

</div>
