<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Mejorado</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
</head>

<body>

  <div class="split-container">

    <div class="left-panel">
      <img src="login/logo1.png" class="header-image" alt="Logo" />
      
      <form class="login-form" (ngSubmit)="login()">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu Usuario"
                 [(ngModel)]="codigo_dni" name="usuario" required pattern="\d+" title="Solo se permiten números">
        </div>        
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control password-input"
              placeholder="Ingresa tu contraseña" [(ngModel)]="password" name="password" required>
            <i class="mdi password-toggle" [ngClass]="showPassword ? 'mdi-eye password-toggle' : 'mdi-eye-off'"
              (click)="togglePassword()"></i>
          </div>
        </div>

        <div class="botoncentra">
          <button type="submit" class="btn btn-primary">Ingresar</button>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
      </form>
      
<!-- ── Separador ─────────────────────────────────────────────────── -->
    <div class="sso-divider">
      <span>o continúa con</span>
    </div>

    <!-- ── Botón Microsoft SSO ──────────────────────────────────────── -->
    <button class="btn-microsoft"
            (click)="loginMicrosoft()"
            [disabled]="cargandoSSO"
            type="button">

      <!-- Logo Microsoft SVG oficial -->
      <svg *ngIf="!cargandoSSO" xmlns="http://www.w3.org/2000/svg"
           width="20" height="20" viewBox="0 0 21 21">
        <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
        <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>

      <!-- Spinner mientras redirige -->
      <span *ngIf="cargandoSSO" class="spinner-ms"></span>

      <span>{{ cargandoSSO ? 'Redirigiendo...' : 'Iniciar sesión con Microsoft' }}</span>
    </button>

  </div>

    <div class="right-panel">
      <img src="login/slohomc.png" class="side-image" alt="Imagen de fondo" />
      <div class="overlay"></div>
    </div>

  </div>

</body>

</html>
