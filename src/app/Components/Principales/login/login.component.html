<div class="min-h-screen w-full bg-surface-soft">
  <div class="grid min-h-screen grid-cols-1 lg:grid-cols-2">

    <!-- PANEL IZQUIERDO / LOGIN -->
    <section class="flex min-h-screen items-center justify-center px-5 py-8 sm:px-8 lg:px-12">
      <div class="w-full max-w-md rounded-3xl border border-border bg-white p-6 shadow-xl sm:p-8">

        <!-- LOGO -->
        <div class="mb-8 flex justify-center">
          <img src="login/logo1.png" alt="Logo" class="h-20 max-w-[220px] object-contain sm:h-24" />
        </div>

        <!-- TITULO -->
        <div class="mb-7 text-center">
          <h1 class="text-2xl font-extrabold text-secondary sm:text-3xl">Bienvenido</h1>
          <p class="mt-2 text-sm font-medium text-ink-75">Ingresa tus credenciales para acceder al sistema.</p>
        </div>

        <!-- FORMULARIO -->
        <form class="space-y-5" (ngSubmit)="login()">

          <!-- USUARIO -->
          <div class="flex flex-col gap-2">
            <label for="usuario" class="text-sm font-bold text-ink">Usuario</label>
            <input
              id="usuario"
              type="text"
              inputmode="numeric"
              pattern="\d+"
              title="Solo se permiten números"
              placeholder="Ingresa tu usuario"
              [(ngModel)]="codigo_dni"
              name="usuario"
              required
              class="w-full rounded-xl border border-border bg-surface-soft px-4 py-3 text-sm text-ink placeholder-ink-25 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20" />
          </div>

          <!-- CONTRASEÑA -->
          <div class="flex flex-col gap-2">
            <label for="password" class="text-sm font-bold text-ink">Contraseña</label>
            <div class="relative">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Ingresa tu contraseña"
                [(ngModel)]="password"
                name="password"
                required
                class="w-full rounded-xl border border-border bg-surface-soft px-4 py-3 pr-12 text-sm text-ink placeholder-ink-25 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20" />
              <button
                type="button"
                class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full text-ink-75 transition hover:bg-primary-25 hover:text-secondary"
                (click)="togglePassword()"
                title="Mostrar/Ocultar contraseña">
                <i class="pi text-base" [ngClass]="showPassword ? 'pi-eye' : 'pi-eye-slash'"></i>
              </button>
            </div>
          </div>

          <!-- BOTÓN LOGIN -->
          <button
            type="submit"
            class="mt-2 flex w-full items-center justify-center gap-2 rounded-xl bg-secondary px-4 py-3 text-sm font-bold text-white shadow-md transition hover:bg-secondary/90 hover:shadow-lg active:scale-[0.98]">
            <i class="pi pi-sign-in"></i>
            Ingresar
          </button>

          <!-- OLVIDASTE CONTRASEÑA -->
          <div class="text-center">
            <a href="#" class="text-sm font-semibold text-secondary transition hover:text-primary">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
        </form>

        <!-- DIVISOR SSO -->
        <div class="my-6 flex items-center gap-3">
          <div class="h-px flex-1 bg-border"></div>
          <span class="text-xs font-medium text-ink-50">o continúa con</span>
          <div class="h-px flex-1 bg-border"></div>
        </div>

        <!-- BOTÓN MICROSOFT -->
        <button
          type="button"
          (click)="loginMicrosoft()"
          [disabled]="cargandoSSO"
          class="flex w-full items-center justify-center gap-3 rounded-xl border border-border bg-white px-4 py-3 text-sm font-medium text-ink shadow-sm transition hover:bg-surface-soft hover:shadow-md disabled:cursor-not-allowed disabled:opacity-70">
          <!-- Logo Microsoft -->
          <svg *ngIf="!cargandoSSO" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21">
            <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
            <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
            <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
            <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
          </svg>
          <!-- Spinner -->
          <span *ngIf="cargandoSSO" class="h-5 w-5 animate-spin rounded-full border-2 border-border border-t-primary"></span>
          <span>{{ cargandoSSO ? 'Redirigiendo...' : 'Iniciar sesión con Microsoft' }}</span>
        </button>

      </div>
    </section>

    <!-- PANEL DERECHO / IMAGEN -->
    <section class="relative hidden min-h-screen overflow-hidden lg:block">
      <img src="login/slohomc.png" alt="Imagen de fondo" class="h-full w-full object-cover" />
      <div class="absolute inset-0 bg-secondary/45"></div>
    </section>

  </div>
</div>
