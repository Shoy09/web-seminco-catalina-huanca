<div class="layout-shell min-h-screen bg-surface-soft text-ink"
  [class.layout-sidebar-collapsed]="menuColapsado"
  [class.sidebar-mobile-open]="menuMovilAbierto"
  [style.--app-sidebar-width]="menuColapsado ? '84px' : '280px'">
  <div *ngIf="menuMovilAbierto" class="sidebar-backdrop" (click)="cerrarMenuMovil()" aria-hidden="true"></div>

  <aside id="app-sidebar" class="app-sidebar" [class.is-compact]="sidebarCompacto"
    [class.is-mobile-open]="menuMovilAbierto" [cdkTrapFocus]="menuMovilAbierto" [cdkTrapFocusAutoCapture]="menuMovilAbierto"
    aria-label="Menú principal" (keydown.escape)="cerrarMenuMovil()">
    <div class="sidebar-brand">
      <img src="login/logo1.png" alt="Seminco" />
      <div *ngIf="!sidebarCompacto" class="sidebar-brand-copy"><strong>SEMINCO</strong><span>Portal de operaciones</span></div>
      <button type="button" class="sidebar-close" (click)="cerrarMenuMovil()" aria-label="Cerrar menú"><i class="pi pi-times" aria-hidden="true"></i></button>
    </div>

    <div class="sidebar-user" [class.compact-user]="sidebarCompacto">
      <span class="user-avatar" [title]="nombreUsuario">{{ nombreUsuario | slice:0:2 | uppercase }}</span>
      <div *ngIf="!sidebarCompacto" class="user-details"><strong [title]="nombreUsuario">{{ nombreUsuario }}</strong><span>{{ rolUsuario || 'Usuario' }}</span></div>
    </div>

    <nav class="sidebar-nav" aria-label="Secciones">
      <span *ngIf="!sidebarCompacto" class="nav-caption">Espacio de trabajo</span>
      <ul class="nav-list">
        <li *ngFor="let menu of menus; let i = index">
          <button type="button" pRipple class="nav-parent" [class.is-active]="isMenuPadreActivo(menu)" [class.is-open]="menuOpenIndex === i"
            (click)="onMenuPrincipalClick(i, menu)" [title]="menu.label || ''" [attr.aria-label]="menu.label"
            [attr.aria-expanded]="sidebarCompacto ? null : menuOpenIndex === i" [attr.aria-controls]="sidebarCompacto ? null : 'sidebar-group-' + i">
            <span class="nav-icon"><i [class]="menu.icon" aria-hidden="true"></i></span>
            <span *ngIf="!sidebarCompacto" class="nav-label">{{ menu.label }}</span>
            <i *ngIf="!sidebarCompacto" class="pi pi-chevron-down nav-chevron" [class.rotated]="menuOpenIndex === i" aria-hidden="true"></i>
          </button>
          <ul *ngIf="!sidebarCompacto && menuOpenIndex === i" [id]="'sidebar-group-' + i" class="nav-children">
            <li *ngFor="let subItem of menu.items">
              <a [routerLink]="subItem.routerLink" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="is-current" ariaCurrentWhenActive="page" (click)="cerrarMenuMovil()">{{ subItem.label }}</a>
            </li>
          </ul>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button type="button" pRipple class="logout-button" (click)="cerrarSesion()" title="Cerrar sesión" aria-label="Cerrar sesión"><i class="pi pi-sign-out" aria-hidden="true"></i><span *ngIf="!sidebarCompacto">Cerrar sesión</span></button>
      <span *ngIf="!sidebarCompacto" class="sidebar-operation">Operación: Catalina Huanca</span>
    </div>
  </aside>

  <!-- MAIN LAYOUT -->
  <div class="min-h-screen transition-all duration-300"
    [ngClass]="{ 'md:pl-[84px]': menuColapsado, 'md:pl-[280px]': !menuColapsado }">

    <!-- TOP BAR -->
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-border bg-white/90 px-4 shadow-sm backdrop-blur md:px-6">
      <!-- IZQUIERDA -->
      <div class="flex items-center gap-3">
        <!-- HAMBURGUESA MOBILE -->
        <button type="button" pRipple
          class="flex h-10 w-10 items-center justify-center rounded-xl text-secondary transition hover:bg-primary-25 md:hidden"
          (click)="toggleMenuMovil()" aria-label="Abrir menú" aria-controls="app-sidebar" [attr.aria-expanded]="menuMovilAbierto">
          <i class="pi pi-bars text-xl"></i>
        </button>
        <!-- BOTÓN COLAPSAR DESKTOP -->
        <button type="button" pRipple
          class="hidden h-10 w-10 items-center justify-center rounded-xl text-secondary transition hover:bg-primary-25 md:flex"
          (click)="colapsarMenu()"
          title="Contraer / expandir menú" [attr.aria-label]="menuColapsado ? 'Expandir menú' : 'Contraer menú'" aria-controls="app-sidebar" [attr.aria-expanded]="!menuColapsado">
          <i class="pi text-lg" [ngClass]="menuColapsado ? 'pi-bars' : 'pi-angle-left'"></i>
        </button>
      </div>

      <!-- DERECHA -->
      <div class="flex items-center gap-3">
        <!-- NOTIFICACIONES -->
        <button type="button" pRipple
          class="relative flex h-10 w-10 items-center justify-center rounded-xl text-ink-75 transition hover:bg-primary-25 hover:text-secondary"
          title="Notificaciones">
          <i class="pi pi-bell text-lg"></i>
          <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-accent"></span>
        </button>

      </div>
    </header>

    <!-- CONTENT -->
    <main class="min-h-[calc(100vh-4rem)] overflow-x-hidden p-4 md:p-6">
      <ng-content></ng-content>
    </main>
  </div>
</div>
