<div class="flex flex-col items-center justify-center p-6 min-w-[300px]">
  <!-- Spinner de carga -->
  <mat-spinner diameter="50" class="mb-4"></mat-spinner>
  
  <!-- Mensaje principal -->
  <p class="text-gray-700 font-medium text-center mb-3">
    {{ data.mensaje || 'Cargando, por favor espere...' }}
  </p>
  
  <!-- Barra de progreso -->
  <div class="w-full max-w-xs bg-gray-200 rounded-full h-2.5 mb-2">
    <div 
      class="bg-blue-600 h-2.5 rounded-full transition-all duration-300 ease-in-out"
      [style.width]="(data.current / data.total * 100) + '%'"
    ></div>
  </div>
  
  <!-- Contador de registros -->
  <p class="text-sm text-gray-600">
    {{ data.current }} de {{ data.total }} registros procesados
    <span class="text-xs text-gray-400 ml-1">
      ({{ (data.current / data.total * 100) | number:'1.0-0' }}%)
    </span>
  </p>
</div>
