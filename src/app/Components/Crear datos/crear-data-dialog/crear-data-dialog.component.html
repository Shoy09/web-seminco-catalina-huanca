<div class="data-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-database" aria-hidden="true"></i></span><div><h2 mat-dialog-title>{{ data.editando ? 'Editar registro' : 'Nuevo registro' }}</h2><p>{{ data.categoria.nombre }}</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form [formGroup]="form" class="form-grid"><div class="field" *ngFor="let campo of data.categoria.campos"><label [for]="'catalog-' + campo.nombre">{{ campo.label }}</label><select *ngIf="campo.tipo === 'select'; else inputTpl" [id]="'catalog-' + campo.nombre" [formControlName]="campo.nombre" (ngModelChange)="onCampoChange(campo.nombre)"><option value="" disabled>Seleccionar</option><option *ngFor="let opcion of campo.opciones" [ngValue]="opcion">{{ opcion }}</option></select><ng-template #inputTpl><input [id]="'catalog-' + campo.nombre" [type]="campo.tipo" [attr.step]="campo.tipo === 'number' ? 'any' : null" [formControlName]="campo.nombre" /></ng-template></div></form></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" [disabled]="form.invalid"><i class="pi pi-check" aria-hidden="true"></i>{{ data.editando ? 'Guardar cambios' : 'Crear registro' }}</button></div></div>
