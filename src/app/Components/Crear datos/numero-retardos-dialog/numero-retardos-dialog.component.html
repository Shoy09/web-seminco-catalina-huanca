<div class="w-full">

  <!-- Título -->
  <div class="flex items-center justify-between border-b border-border px-6 py-4">
    <div>
      <p class="text-[10px] font-bold uppercase tracking-widest text-ink-50">
        {{ editando ? 'Editando registro' : 'Nuevo registro' }}
      </p>
      <h2 class="text-lg font-black text-ink">Número de Retardo</h2>
    </div>
    <button mat-icon-button (click)="cancelar()" class="!text-ink-50 hover:!text-danger">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Contenido -->
  <mat-dialog-content class="!px-6 !py-5">
    <form [formGroup]="form" class="grid grid-cols-1 gap-4 sm:grid-cols-2">

      <!-- Código -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold uppercase tracking-wide text-ink-50">Código</label>
        <mat-form-field appearance="outline" class="w-full">
          <input matInput formControlName="codigo" placeholder="Ej: NR-001" />
        </mat-form-field>
      </div>

      <!-- Enumeración -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold uppercase tracking-wide text-ink-50">Enumeración</label>
        <mat-form-field appearance="outline" class="w-full">
          <input matInput type="number" formControlName="enumeracion" placeholder="Ej: 1" />
        </mat-form-field>
      </div>

      <!-- Tipo (de la tabla Retardos) -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold uppercase tracking-wide text-ink-50">Tipo</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="tipo" placeholder="Seleccionar tipo"
            (selectionChange)="onTipoChange($event.value)">
            <mat-option *ngFor="let t of tiposDisponibles" [value]="t">{{ t }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Longitud (filtrada por tipo) -->
      <div class="flex flex-col gap-1">
        <label class="text-xs font-bold uppercase tracking-wide text-ink-50">
          Longitud
          <span *ngIf="!form.get('tipo')?.value" class="ml-1 normal-case font-normal text-ink-25">
            (selecciona un tipo primero)
          </span>
        </label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="longitud" placeholder="Seleccionar longitud">
            <mat-option *ngFor="let l of longitudesFiltradas" [value]="l">{{ l }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

    </form>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="flex items-center gap-2 mt-3 text-xs text-ink-50">
      <i class="pi pi-spin pi-spinner"></i>
      Cargando retardos...
    </div>
  </mat-dialog-content>

  <!-- Acciones -->
  <mat-dialog-actions align="end" class="!px-6 !pb-5 !pt-2 gap-2">
    <button mat-stroked-button (click)="cancelar()" class="!rounded-xl">
      Cancelar
    </button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="form.invalid"
      (click)="guardar()"
      class="!rounded-xl"
    >
      <mat-icon class="!h-4 !w-4 !text-sm">{{ editando ? 'save' : 'add' }}</mat-icon>
      {{ editando ? 'Actualizar' : 'Guardar' }}
    </button>
  </mat-dialog-actions>

</div>
