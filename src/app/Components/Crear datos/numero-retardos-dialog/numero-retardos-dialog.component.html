<div class="data-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-clock" aria-hidden="true"></i></span><div><h2 mat-dialog-title>{{ editando ? 'Editar número de retardo' : 'Nuevo número de retardo' }}</h2><p>Define el tipo, la longitud y su enumeración.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form [formGroup]="form" class="form-grid"><div class="field"><label for="delay-code">Código <span class="required">*</span></label><input id="delay-code" formControlName="codigo" placeholder="Ej. NR-001" aria-describedby="delay-code-error" /><p id="delay-code-error" *ngIf="form.get('codigo')?.invalid && form.get('codigo')?.touched" class="field-error">Ingresa el código del retardo.</p></div><div class="field"><label for="delay-number">Enumeración <span class="required">*</span></label><input id="delay-number" type="number" formControlName="enumeracion" placeholder="Ej. 1" aria-describedby="delay-number-error" /><p id="delay-number-error" *ngIf="form.get('enumeracion')?.invalid && form.get('enumeracion')?.touched" class="field-error">Ingresa un número mayor o igual a cero.</p></div><div class="field"><label for="delay-type">Tipo <span class="required">*</span></label><select id="delay-type" formControlName="tipo" (ngModelChange)="onTipoChange($event)"><option value="" disabled>Seleccionar tipo</option><option *ngFor="let t of tiposDisponibles" [value]="t">{{ t }}</option></select></div><div class="field"><label for="delay-length">Longitud <span class="required">*</span></label><select id="delay-length" formControlName="longitud"><option value="" disabled>Seleccionar longitud</option><option *ngFor="let l of longitudesFiltradas" [ngValue]="l">{{ l }}</option></select><p *ngIf="!form.get('tipo')?.value" class="field-hint">Selecciona primero un tipo de retardo.</p></div></form><div *ngIf="cargando" class="status-message" role="status"><i class="pi pi-spin pi-spinner" aria-hidden="true"></i>Cargando tipos y longitudes…</div></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" [disabled]="form.invalid"><i class="pi pi-check" aria-hidden="true"></i>{{ editando ? 'Guardar cambios' : 'Crear retardo' }}</button></div></div>
