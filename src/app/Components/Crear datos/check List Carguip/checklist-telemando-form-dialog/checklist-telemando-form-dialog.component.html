<div class="data-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-check-square" aria-hidden="true"></i></span><div><h2 mat-dialog-title>{{ titulo }}</h2><p>Define el nombre de la verificación de telemando.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form [formGroup]="form"><div class="field"><label for="telemando-name">Nombre del checklist <span class="required">*</span></label><input id="telemando-name" formControlName="nombre" placeholder="Ingresa el nombre del checklist" aria-describedby="telemando-error" /><p id="telemando-error" *ngIf="nombreInvalido" class="field-error"><span *ngIf="nombre?.errors?.['required']">El nombre es obligatorio.</span><span *ngIf="nombre?.errors?.['minlength']">Usa al menos 3 caracteres.</span><span *ngIf="nombre?.errors?.['maxlength']">Máximo 100 caracteres.</span></p></div></form></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" [disabled]="form.invalid"><i class="pi pi-check" aria-hidden="true"></i>{{ modo === 'crear' ? 'Crear checklist' : 'Guardar cambios' }}</button></div></div>
