<div class="data-page"><header class="page-heading"><span class="heading-icon"><i class="pi pi-wifi" aria-hidden="true"></i></span><div><h1>Checklist de telemando</h1><p>Administra las verificaciones de los equipos de carguío.</p></div><div class="heading-actions"><button type="button" class="ui-button primary" (click)="abrirDialogoCrear()"><i class="pi pi-plus" aria-hidden="true"></i>Nuevo checklist</button></div></header><section class="panel"><div class="data-toolbar"><div class="search-field"><i class="pi pi-search" aria-hidden="true"></i><input type="search" (input)="applyFilter($event)" placeholder="Buscar por nombre…" aria-label="Buscar checklist de telemando" /></div><span class="results-count" role="status"><strong>{{ dataSource.filteredData.length }}</strong> registros</span></div><div class="table-scroll" tabindex="0" role="region" aria-label="Tabla de checklists de telemando"><table mat-table [dataSource]="dataSource"><ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let item">{{ item.id }}</td></ng-container><ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef>Nombre del checklist</th><td mat-cell *matCellDef="let item">{{ item.nombre }}</td></ng-container><ng-container matColumnDef="acciones"><th mat-header-cell *matHeaderCellDef class="actions-header">Acciones</th><td mat-cell *matCellDef="let item"><div class="row-actions"><button type="button" class="icon-button" (click)="abrirDialogoEditar(item)" aria-label="Editar checklist" title="Editar checklist"><i class="pi pi-pencil" aria-hidden="true"></i></button><button type="button" class="icon-button danger" (click)="eliminarItem(item.id!)" aria-label="Eliminar checklist" title="Eliminar checklist"><i class="pi pi-trash" aria-hidden="true"></i></button></div></td></ng-container><tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr><tr *matNoDataRow><td class="empty-state" [attr.colspan]="displayedColumns.length"><i class="pi pi-inbox" aria-hidden="true"></i><strong>No hay checklists para mostrar</strong><span>Crea uno nuevo o ajusta la búsqueda.</span></td></tr></table></div><mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,20,50]" showFirstLastButtons aria-label="Paginación del checklist de telemando"></mat-paginator></section></div>
