<div class="mx-auto w-[95%] max-w-7xl rounded-2xl border border-border bg-surface p-5 shadow-sm">

  <p-table
    #dt
    [value]="checklistsTelemando"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    [globalFilterFields]="['id', 'nombre']"
    [tableStyle]="{ 'min-width': '700px' }"
    styleClass="p-datatable-sm"
    [showGridlines]="true"
  >

    <!-- HEADER / ACCIONES -->
    <ng-template pTemplate="caption">
      <div class="flex flex-col gap-4">

        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <h2 class="text-2xl font-extrabold text-secondary">
              Checklists de Telemando
            </h2>

            <p class="mt-1 text-sm text-ink-75">
              Gestión de checklists disponibles para telemando.
            </p>
          </div>

          <button
            pButton
            type="button"
            label="Crear Nuevo Checklist"
            icon="pi pi-plus"
            severity="success"
            (click)="abrirDialogoCrear()">
          </button>
        </div>

        <!-- BUSCADOR -->
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <span class="p-input-icon-left w-full sm:max-w-md">
            <input
              pInputText
              type="text"
              class="w-full"
              placeholder="Buscar por ID o nombre"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
          </span>

          <button
            pButton
            type="button"
            label="Limpiar"
            icon="pi pi-filter-slash"
            severity="secondary"
            outlined="true"
            (click)="dt.clear()">
          </button>
        </div>

      </div>
    </ng-template>

    <!-- CABECERA -->
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id" class="w-24 text-center">
          ID
          <p-sortIcon field="id"></p-sortIcon>
        </th>

        <th pSortableColumn="nombre">
          Nombre del Checklist
          <p-sortIcon field="nombre"></p-sortIcon>
        </th>

        <th class="w-36 text-center">
          Acciones
        </th>
      </tr>
    </ng-template>

    <!-- BODY -->
    <ng-template pTemplate="body" let-item>
      <tr>
        <td class="text-center">
          <span class="inline-flex rounded-full bg-primary-25 px-3 py-1 text-xs font-bold text-secondary">
            {{ item.id }}
          </span>
        </td>

        <td>
          <span class="font-semibold text-ink">
            {{ item.nombre }}
          </span>
        </td>

        <td>
          <div class="flex items-center justify-center gap-2">

            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              severity="info"
              rounded="true"
              text="true"
              title="Editar"
              (click)="abrirDialogoEditar(item)">
            </button>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              severity="danger"
              rounded="true"
              text="true"
              title="Eliminar"
              (click)="eliminarItem(item.id!)">
            </button>

          </div>
        </td>
      </tr>
    </ng-template>

    <!-- SIN DATOS -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3">
          <div class="flex flex-col items-center justify-center gap-2 py-8 text-ink-75">
            <i class="pi pi-info-circle text-2xl"></i>
            <span class="font-semibold">
              No hay checklists de telemando disponibles.
            </span>
          </div>
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
