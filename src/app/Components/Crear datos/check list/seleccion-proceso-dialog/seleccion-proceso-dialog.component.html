<div class="data-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-sitemap" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Proceso del checklist</h2><p>Selecciona el proceso al que pertenece la verificación.</p></div><button type="button" class="icon-button" (click)="cerrarDialogo()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><form class="dialog-form" (ngSubmit)="continuar()"><div class="dialog-body"><div class="field"><label for="proceso-checklist-dialog">Proceso</label><select id="proceso-checklist-dialog" name="proceso" [(ngModel)]="proceso" required><option value="" disabled>Seleccionar proceso</option>@for (nombre of procesos; track nombre) { <option [value]="nombre">{{ nombre }}</option> }</select>@if (error) { <p role="alert" class="field-error">{{ error }}</p> }</div></div><footer class="dialog-actions"><button type="button" class="ui-button" (click)="cerrarDialogo()">Cancelar</button><button type="submit" class="ui-button primary" [disabled]="!proceso.trim()">Continuar<i class="pi pi-arrow-right" aria-hidden="true"></i></button></footer></form></div>
