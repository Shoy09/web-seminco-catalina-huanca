
<div class="max-h-[90dvh] overflow-y-auto bg-surface text-ink">
  <header class="border-b border-border bg-gradient-to-r from-secondary via-secondary-75 to-primary p-5 text-white sm:p-6">
    <h2 class="text-xl font-black">Proceso del checklist</h2>
    <p class="mt-2 text-sm text-white/80">Selecciona el proceso al que pertenece el checklist.</p>
  </header>
  <form (ngSubmit)="continuar()">
    <div class="space-y-3 p-5 sm:p-6">
      <label for="proceso-checklist-dialog" class="block text-sm font-bold">Proceso</label>
      <select id="proceso-checklist-dialog" name="proceso" [(ngModel)]="proceso" required class="min-h-11 w-full rounded-2xl border border-border bg-surface-soft px-4 py-2 text-base outline-none focus:border-primary focus:ring-2 focus:ring-primary/20">
        <option value="" disabled>Seleccionar proceso</option>
        @for (nombre of procesos; track nombre) { <option [value]="nombre">{{ nombre }}</option> }
      </select>
      @if (error) { <p role="alert" class="text-xs text-danger">{{ error }}</p> }
    </div>
    <footer class="flex flex-wrap justify-end gap-3 border-t border-border bg-surface-soft px-5 py-4 sm:px-6">
      <button type="button" (click)="cerrarDialogo()" class="min-h-11 rounded-xl border border-border bg-surface px-4 py-2 text-sm font-semibold">Cancelar</button>
      <button type="submit" [disabled]="!proceso.trim()" class="min-h-11 rounded-xl bg-secondary px-4 py-2 text-sm font-bold text-white disabled:opacity-50">Continuar</button>
    </footer>
  </form>
</div>
