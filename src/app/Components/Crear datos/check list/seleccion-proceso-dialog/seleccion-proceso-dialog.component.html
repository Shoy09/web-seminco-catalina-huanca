<div class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-xl">

  <!-- HEADER FIJO -->
  <div class="shrink-0 border-b border-border px-6 py-5">
    <h2 class="text-2xl font-extrabold text-secondary">
      Selecciona un Proceso
    </h2>

    <p class="mt-1 text-sm text-ink-75">
      Elige el proceso para continuar con la creación del registro.
    </p>
  </div>

  <!-- CONTENIDO CON SCROLL -->
  <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">

      <button
        *ngFor="let proceso of procesos"
        pButton
        pRipple
        type="button"
        [label]="proceso.nombre"
        icon="pi pi-check-circle"
        class="w-full justify-start !bg-secondary !border-secondary !text-white hover:!bg-secondary/90"
        (click)="seleccionarProceso(proceso)">
      </button>

    </div>

  </div>

  <!-- FOOTER FIJO -->
  <div class="shrink-0 flex justify-center gap-3 border-t border-border px-6 py-4">

    <button
      pButton
      type="button"
      label="Cerrar"
      icon="pi pi-times"
      severity="danger"
      outlined="true"
      (click)="cerrarDialogo()">
    </button>

  </div>

</div>
