<div class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-xl">

  <!-- HEADER FIJO -->
  <div class="shrink-0 border-b border-border px-6 py-5">
    <h2 class="flex items-center gap-2 text-2xl font-extrabold text-secondary">
      <i class="pi pi-plus-circle text-primary"></i>
      Selecciona una opción
    </h2>

    <p class="mt-1 text-sm text-ink-75">
      Elige cómo deseas ingresar los registros al sistema.
    </p>
  </div>

  <!-- CONTENIDO -->
  <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

      <!-- INGRESAR UNO -->
      <button
        pButton
        pRipple
        type="button"
        class="flex min-h-32 w-full flex-col items-center justify-center gap-3 rounded-2xl border border-border bg-white p-5 text-secondary shadow-sm transition hover:-translate-y-1 hover:border-primary hover:bg-primary-25 hover:shadow-lg"
        (click)="seleccionar('estado')"
      >
        <span class="text-sm font-extrabold">
          Ingresar uno
        </span>
      </button>

      <!-- INGRESAR DESDE EXCEL -->
      <button
        pButton
        pRipple
        type="button"
        class="flex min-h-32 w-full flex-col items-center justify-center gap-3 rounded-2xl border border-border bg-white p-5 text-secondary shadow-sm transition hover:-translate-y-1 hover:border-primary hover:bg-primary-25 hover:shadow-lg"
        (click)="seleccionar('excel')"
      >
        <span class="text-sm font-extrabold">
          Ingresar desde Excel
        </span>
      </button>

    </div>

  </div>

  <!-- FOOTER FIJO -->
  <div class="shrink-0 flex justify-center border-t border-border px-6 py-4">
    <button
      pButton
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      severity="danger"
      outlined="true"
      (click)="cerrarDialogo()">
    </button>
  </div>

</div>
