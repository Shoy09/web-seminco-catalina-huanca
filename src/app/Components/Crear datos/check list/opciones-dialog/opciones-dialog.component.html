
<div class="max-h-[90dvh] overflow-y-auto bg-surface text-ink">
  <header class="border-b border-border bg-gradient-to-r from-secondary via-secondary-75 to-primary p-5 text-white sm:p-6"><div><h2 class="text-xl font-black">Agregar &iacute;tems</h2><p class="mt-2 text-sm text-white/80">{{ data.proceso }}</p></div></header>
  <div class="space-y-5 p-5 sm:p-6">
    <p class="text-sm leading-relaxed text-ink-75">Selecciona c&oacute;mo deseas ingresar los &iacute;tems del checklist.</p>
    <div class="grid gap-3">
      <button type="button" class="flex w-full items-center gap-3 rounded-2xl border border-border bg-surface-soft p-4 text-left text-secondary transition hover:border-primary hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-primary" (click)="seleccionar('estado')"><i class="pi pi-pencil text-lg text-primary" aria-hidden="true"></i><span class="min-w-0 flex-1"><strong class="block text-sm font-bold">Ingreso manual</strong><small class="text-xs leading-relaxed text-ink-50">Crear un &iacute;tem con su categor&iacute;a y nombre.</small></span><i class="pi pi-angle-right shrink-0 text-ink-50" aria-hidden="true"></i></button>
      <button type="button" class="flex w-full items-center gap-3 rounded-2xl border border-border bg-surface-soft p-4 text-left text-secondary transition hover:border-primary hover:bg-primary/10 focus-visible:outline-2 focus-visible:outline-primary" (click)="seleccionar('excel')"><i class="pi pi-upload text-lg text-success" aria-hidden="true"></i><span class="min-w-0 flex-1"><strong class="block text-sm font-bold">Importar desde Excel</strong><small class="text-xs leading-relaxed text-ink-50">Cargar varios &iacute;tems desde un archivo .xls o .xlsx.</small></span><i class="pi pi-angle-right shrink-0 text-ink-50" aria-hidden="true"></i></button>
    </div>
  </div>
  <footer class="flex flex-wrap justify-end gap-3 border-t border-border bg-surface-soft px-5 py-4 sm:px-6"><button type="button" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-border bg-surface px-4 py-2 text-sm font-semibold text-ink transition hover:bg-surface-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" (click)="dialogRef.close()">Cancelar</button></footer>
</div>
