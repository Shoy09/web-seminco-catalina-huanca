<div class="mx-auto w-[95%] max-w-7xl rounded-2xl border border-border bg-surface p-5 shadow-sm">

  <p-table
    #dt
    [value]="checklistItems"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [globalFilterFields]="['proceso', 'categoria', 'nombre']"
    [tableStyle]="{ 'min-width': '850px' }"
    styleClass="p-datatable-sm"
    [showGridlines]="true"
  >

    <!-- HEADER / ACCIONES -->
    <ng-template pTemplate="caption">
      <div class="flex flex-col gap-4">

        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div>
            <h2 class="text-2xl font-extrabold text-secondary">
              Check List Items
            </h2>

            <p class="mt-1 text-sm text-ink-75">
              Gestión de ítems por proceso y categoría.
            </p>
          </div>

          <button
            pButton
            type="button"
            label="Crear Nuevo"
            icon="pi pi-plus"
            severity="success"
            (click)="abrirSeleccionProcesoDialogo()">
          </button>
        </div>

        <!-- BUSCADOR -->
        <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
          <span class="p-input-icon-left w-full sm:max-w-md">
            <input
              pInputText
              type="text"
              class="w-full"
              placeholder="Buscar por proceso, categoría o nombre"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
          </span>

          <button
            pButton
            type="button"
            label="Limpiar"
            icon="pi pi-filter-slash"
            severity="secondary"
            outlined="true"
            (click)="dt.clear()">
          </button>
        </div>

      </div>
    </ng-template>

    <!-- CABECERA -->
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="proceso">
          Proceso
          <p-sortIcon field="proceso"></p-sortIcon>
        </th>

        <th pSortableColumn="categoria">
          Categoría
          <p-sortIcon field="categoria"></p-sortIcon>
        </th>

        <th pSortableColumn="nombre">
          Nombre
          <p-sortIcon field="nombre"></p-sortIcon>
        </th>

        <th class="text-center">
          Acciones
        </th>
      </tr>
    </ng-template>

    <!-- BODY -->
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>
          <span class="inline-flex rounded-full border border-primary-50 bg-surface-soft px-3 py-1 text-xs font-bold text-secondary">
            {{ item.proceso }}
          </span>
        </td>

        <td>
          <span class="inline-flex rounded-full bg-primary-25 px-3 py-1 text-xs font-bold text-secondary">
            {{ item.categoria }}
          </span>
        </td>

        <td>
          <span class="font-semibold text-ink">
            {{ item.nombre }}
          </span>
        </td>

        <td>
          <div class="flex items-center justify-center gap-2">

            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              severity="info"
              rounded="true"
              text="true"
              title="Editar"
              (click)="abrirDialogoEditar(item)">
            </button>

            <button
              pButton
              type="button"
              icon="pi pi-trash"
              severity="danger"
              rounded="true"
              text="true"
              title="Eliminar"
              (click)="eliminarItem(item.id!)">
            </button>

          </div>
        </td>
      </tr>
    </ng-template>

    <!-- SIN DATOS -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">
          <div class="flex flex-col items-center justify-center gap-2 py-8 text-ink-75">
            <i class="pi pi-info-circle text-2xl"></i>
            <span class="font-semibold">
              No hay ítems de checklist registrados.
            </span>
          </div>
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
