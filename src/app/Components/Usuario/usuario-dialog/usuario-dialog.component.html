<div class="w-full rounded-2xl bg-surface p-6 shadow-xl">

  <!-- Header -->
  <div class="mb-6 flex items-center justify-between border-b border-border pb-4">
    <div>
      <h2 class="text-2xl font-extrabold text-secondary">
        {{ editMode ? 'Editar Usuario' : 'Nuevo Usuario' }}
      </h2>

      <p class="mt-1 text-sm text-ink-75">
        Complete la información del usuario y sus operaciones autorizadas.
      </p>
    </div>

    <button
      pButton
      type="button"
      icon="pi pi-times"
      severity="secondary"
      text="true"
      rounded="true"
      (click)="cancelar()">
    </button>
  </div>

  <!-- Formulario -->
  <form [formGroup]="usuarioForm" class="space-y-5">

    <!-- DNI / Nombre -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          DNI
        </label>

        <input
          pInputText
          type="text"
          formControlName="codigo_dni"
          placeholder="Ingrese DNI"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Nombre
        </label>

        <input
          pInputText
          type="text"
          formControlName="nombres"
          placeholder="Ingrese nombres"
          class="w-full"
        />
      </div>

    </div>

    <!-- Apellidos / Correo -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Apellidos
        </label>

        <input
          pInputText
          type="text"
          formControlName="apellidos"
          placeholder="Ingrese apellidos"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Correo
        </label>

        <input
          pInputText
          type="email"
          formControlName="correo"
          placeholder="correo@empresa.com"
          class="w-full"
        />
      </div>

    </div>

    <!-- Cargo / Empresa -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Cargo
        </label>

        <p-select
          [options]="cargos"
          formControlName="cargo"
          placeholder="Seleccione cargo"
          styleClass="w-full"
          appendTo="body">
        </p-select>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Empresa
        </label>

        <input
          pInputText
          type="text"
          formControlName="empresa"
          placeholder="Ingrese empresa"
          class="w-full"
        />
      </div>

    </div>

    <!-- Guardia / Autorizado Equipo -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Guardia
        </label>

        <input
          pInputText
          type="text"
          formControlName="guardia"
          placeholder="Ingrese guardia"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Autorizado Equipo
        </label>

        <input
          pInputText
          type="text"
          formControlName="autorizado_equipo"
          placeholder="Equipo autorizado"
          class="w-full"
        />
      </div>

    </div>

    <!-- Rol -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Rol
        </label>

        <p-select
          [options]="roles"
          formControlName="rol"
          placeholder="Seleccione rol"
          styleClass="w-full"
          appendTo="body">
        </p-select>
      </div>

    </div>

    <!-- Operaciones Autorizadas -->
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">
        Operaciones Autorizadas
      </label>

      <p-multiselect
        [options]="operacionesDisponibles"
        formControlName="operaciones_autorizadas"
        placeholder="Seleccione operaciones"
        display="chip"
        [maxSelectedLabels]="4"
        styleClass="w-full"
        appendTo="body">
      </p-multiselect>
    </div>

    <!-- Contraseñas solo nuevo usuario -->
    <div *ngIf="!editMode" class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Contraseña
        </label>

        <p-password
          formControlName="password"
          placeholder="Ingrese contraseña"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>

        <small
          class="text-danger"
          *ngIf="usuarioForm.get('password')?.invalid && usuarioForm.get('password')?.touched"
        >
          Debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">
          Confirmar Contraseña
        </label>

        <p-password
          formControlName="confirmPassword"
          placeholder="Repita la contraseña"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>

        <small
          class="text-danger"
          *ngIf="usuarioForm.hasError('noCoincide') && usuarioForm.get('confirmPassword')?.touched"
        >
          Las contraseñas no coinciden.
        </small>
      </div>

    </div>

    <!-- Footer -->
    <div class="mt-6 flex justify-end gap-3 border-t border-border pt-5">

      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        severity="danger"
        outlined="true"
        (click)="cancelar()">
      </button>

      <button
        pButton
        type="button"
        label="Guardar"
        icon="pi pi-save"
        severity="success"
        [disabled]="usuarioForm.invalid"
        (click)="guardar()">
      </button>

    </div>

  </form>

</div>
