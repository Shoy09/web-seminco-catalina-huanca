<div class="states-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-sitemap" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Proceso del estado</h2><p>Selecciona el proceso al que pertenece el registro.</p></div><button type="button" class="icon-button" (click)="cerrarDialogo()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><div class="process-list"><button type="button" class="process-option" *ngFor="let proceso of procesos" (click)="seleccionarProceso(proceso)"><i class="pi pi-cog" aria-hidden="true"></i><span>{{ proceso }}</span><i class="pi pi-angle-right" aria-hidden="true"></i></button></div></mat-dialog-content><footer class="dialog-actions"><button type="button" class="ui-button" (click)="cerrarDialogo()">Cancelar</button></footer></div>
