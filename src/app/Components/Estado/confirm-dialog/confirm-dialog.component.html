<div class="states-dialog"><div class="dialog-heading"><span class="heading-icon confirm-icon"><i class="pi pi-trash" aria-hidden="true"></i></span><div><h2 mat-dialog-title>{{ data.titulo || 'Eliminar registro' }}</h2><p>Confirma la eliminación del registro seleccionado.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar confirmación"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><p class="confirm-message">{{ data.mensaje }}</p><p class="confirm-note">Esta acción no se puede deshacer.</p></mat-dialog-content><footer class="dialog-actions"><button type="button" class="ui-button" cdkFocusInitial (click)="cancelar()">Cancelar</button><button type="button" class="ui-button delete-button" (click)="confirmar()"><i class="pi pi-trash" aria-hidden="true"></i>Eliminar</button></footer></div>
