<div class="w-full">

  <!-- Título -->
  <div class="flex items-center gap-3 border-b border-border px-6 py-4">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-red-50">
      <mat-icon class="!text-danger">warning</mat-icon>
    </div>
    <h2 class="text-lg font-black text-ink">Confirmar Eliminación</h2>
  </div>

  <!-- Contenido -->
  <mat-dialog-content class="!px-6 !py-5">
    <p class="text-sm text-ink-75 leading-relaxed">{{ data.mensaje }}</p>
  </mat-dialog-content>

  <!-- Acciones -->
  <mat-dialog-actions align="end" class="!px-6 !pb-5 !pt-2 gap-2">
    <button mat-stroked-button (click)="cancelar()" class="!rounded-xl">
      Cancelar
    </button>
    <button
      mat-raised-button
      (click)="confirmar()"
      class="!rounded-xl !bg-danger !text-white">
      <mat-icon class="!h-4 !w-4 !text-sm">delete</mat-icon>
      Eliminar
    </button>
  </mat-dialog-actions>

</div>
