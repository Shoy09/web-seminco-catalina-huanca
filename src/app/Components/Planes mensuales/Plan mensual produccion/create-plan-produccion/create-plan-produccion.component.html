<div class="flex max-h-[90vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl bg-surface shadow-xl">

  <!-- HEADER FIJO -->
  <div class="shrink-0 border-b border-border px-6 py-5">
    <h2 class="text-2xl font-extrabold text-secondary">
      Ingresar Plan de Metraje
    </h2>

    <p class="mt-1 text-sm text-ink-75">
      Registra la información del plan, leyes, valores económicos y distribución dinámica.
    </p>
  </div>

  <!-- CONTENIDO CON SCROLL -->
  <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">

    <form [formGroup]="planForm" class="space-y-6">

      <!-- DATOS GENERALES -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Datos generales
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Año</label>
            <input
              pInputText
              type="number"
              formControlName="anio"
              placeholder="Ej. 2026"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Mes</label>
            <input
              pInputText
              type="text"
              formControlName="mes"
              placeholder="Ej. Enero"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Semana</label>
            <input
              pInputText
              type="text"
              formControlName="semana"
              placeholder="Semana"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Mina</label>
            <input
              pInputText
              type="text"
              formControlName="mina"
              placeholder="Mina"
              class="w-full"
            />
          </div>

        </div>
      </section>

      <!-- UBICACIÓN Y CLASIFICACIÓN -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Ubicación y clasificación
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Zona</label>
            <input
              pInputText
              type="text"
              formControlName="zona"
              placeholder="Zona"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Área</label>
            <input
              pInputText
              type="text"
              formControlName="area"
              placeholder="Área"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Fase</label>
            <input
              pInputText
              type="text"
              formControlName="fase"
              placeholder="Fase"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Tipo de Minado</label>
            <input
              pInputText
              type="text"
              formControlName="minado_tipo"
              placeholder="Tipo de minado"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Tipo de Labor</label>
            <input
              pInputText
              type="text"
              formControlName="tipo_labor"
              placeholder="Tipo de labor"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Tipo de Mineral</label>
            <input
              pInputText
              type="text"
              formControlName="tipo_mineral"
              placeholder="Tipo de mineral"
              class="w-full"
            />
          </div>

        </div>
      </section>

      <!-- INFORMACIÓN DE LABOR -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Información de labor
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Estructura/Veta</label>
            <input
              pInputText
              type="text"
              formControlName="estructura_veta"
              placeholder="Estructura o veta"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Nivel</label>
            <input
              pInputText
              type="text"
              formControlName="nivel"
              placeholder="Nivel"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Block</label>
            <input
              pInputText
              type="text"
              formControlName="block"
              placeholder="Block"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Labor</label>
            <input
              pInputText
              type="text"
              formControlName="labor"
              placeholder="Labor"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Ala</label>
            <input
              pInputText
              type="text"
              formControlName="ala"
              placeholder="Ala"
              class="w-full"
            />
          </div>

        </div>
      </section>

      <!-- PARÁMETROS DE MINADO -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Parámetros de minado
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Ancho Veta</label>
            <input
              pInputText
              type="number"
              formControlName="ancho_veta"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Ancho Minado Semana</label>
            <input
              pInputText
              type="number"
              formControlName="ancho_minado_sem"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Ancho Minado Mes</label>
            <input
              pInputText
              type="number"
              formControlName="ancho_minado_mes"
              placeholder="0.00"
              class="w-full"
            />
          </div>

        </div>
      </section>

      <!-- LEYES Y VALORES -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Leyes y valores económicos
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Ag (g/t)</label>
            <input
              pInputText
              type="number"
              formControlName="ag_gr"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">% Cu</label>
            <input
              pInputText
              type="number"
              formControlName="porcentaje_cu"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">% Pb</label>
            <input
              pInputText
              type="number"
              formControlName="porcentaje_pb"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">% Zn</label>
            <input
              pInputText
              type="number"
              formControlName="porcentaje_zn"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">VPT Actual</label>
            <input
              pInputText
              type="number"
              formControlName="vpt_act"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">VPT Final</label>
            <input
              pInputText
              type="number"
              formControlName="vpt_final"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Cut-Off 1</label>
            <input
              pInputText
              type="number"
              formControlName="cut_off_1"
              placeholder="0.00"
              class="w-full"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Cut-Off 2</label>
            <input
              pInputText
              type="number"
              formControlName="cut_off_2"
              placeholder="0.00"
              class="w-full"
            />
          </div>

        </div>
      </section>

      <!-- PROGRAMACIÓN -->
      <section>
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Programación
        </h3>

        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">

          <div class="flex flex-col gap-2">
            <label class="text-sm font-bold text-ink">Programado</label>

            <p-select
              [options]="programadoOptions"
              formControlName="programado"
              placeholder="Seleccione"
              styleClass="w-full"
              appendTo="body">
            </p-select>
          </div>

        </div>
      </section>

      <!-- CAMPOS DINÁMICOS -->
      <section *ngIf="camposDinamicos?.length">
        <h3 class="mb-4 text-lg font-extrabold text-secondary">
          Distribución diaria / campos dinámicos
        </h3>

        <div class="rounded-2xl border border-border bg-surface-soft p-4">
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8">

            <div
              *ngFor="let campo of camposDinamicos"
              class="flex flex-col gap-2"
            >
              <label class="text-xs font-bold text-ink">
                {{ campo }}
              </label>

              <input
                pInputText
                type="number"
                [formControlName]="campo"
                placeholder="0"
                class="w-full"
              />
            </div>

          </div>
        </div>
      </section>

    </form>

  </div>

  <!-- FOOTER FIJO -->
  <div class="shrink-0 flex justify-end gap-3 border-t border-border px-6 py-4">

    <button
      pButton
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      severity="danger"
      outlined="true"
      (click)="cancelar()">
    </button>

    <button
      pButton
      type="button"
      label="Guardar"
      icon="pi pi-save"
      severity="success"
      [disabled]="planForm.invalid"
      (click)="guardar()">
    </button>

  </div>

</div>
