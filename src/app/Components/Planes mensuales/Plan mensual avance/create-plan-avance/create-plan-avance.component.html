<div class="plan-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-chart-line" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Nuevo plan de avance</h2><p>Completa la información del plan mensual.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form [formGroup]="planForm"><div class="form-grid plan-fields"><div class="field"><label for="plan-avance-anio">Año</label><input id="plan-avance-anio" type="number" step="any" formControlName="anio"  /></div>
<div class="field"><label for="plan-avance-mes">Mes</label><input id="plan-avance-mes" type="text"  formControlName="mes"  /></div>
<div class="form-divider">Datos del plan</div><div class="field"><label for="plan-avance-minado_tipo">Tipo de Minado</label><input id="plan-avance-minado_tipo" type="text"  formControlName="minado_tipo"  /></div>
<div class="field"><label for="plan-avance-empresa">Empresa</label><input id="plan-avance-empresa" type="text"  formControlName="empresa"  /></div>
<div class="field"><label for="plan-avance-zona">Zona</label><input id="plan-avance-zona" type="text"  formControlName="zona"  /></div>
<div class="field"><label for="plan-avance-area">Área</label><input id="plan-avance-area" type="text"  formControlName="area"  /></div>
<div class="field"><label for="plan-avance-tipo_mineral">Tipo de Mineral</label><input id="plan-avance-tipo_mineral" type="text"  formControlName="tipo_mineral"  /></div>
<div class="field"><label for="plan-avance-fase">Fase</label><input id="plan-avance-fase" type="text"  formControlName="fase"  /></div>
<div class="field"><label for="plan-avance-estructura_veta">Estructura/Veta</label><input id="plan-avance-estructura_veta" type="text"  formControlName="estructura_veta"  /></div>
<div class="field"><label for="plan-avance-nivel">Nivel</label><input id="plan-avance-nivel" type="text"  formControlName="nivel"  /></div>
<div class="field"><label for="plan-avance-tipo_labor">Tipo de Labor</label><input id="plan-avance-tipo_labor" type="text"  formControlName="tipo_labor"  /></div>
<div class="field"><label for="plan-avance-labor">Labor</label><input id="plan-avance-labor" type="text"  formControlName="labor"  /></div>
<div class="field"><label for="plan-avance-ala">Ala</label><input id="plan-avance-ala" type="text"  formControlName="ala"  /></div>
<div class="field"><label for="plan-avance-avance_m">Avance (m)</label><input id="plan-avance-avance_m" type="number" step="any" formControlName="avance_m"  /></div>
<div class="field"><label for="plan-avance-ancho_m">Ancho (m)</label><input id="plan-avance-ancho_m" type="number" step="any" formControlName="ancho_m"  /></div>
<div class="field"><label for="plan-avance-alto_m">Alto (m)</label><input id="plan-avance-alto_m" type="number" step="any" formControlName="alto_m"  /></div>
<div class="field"><label for="plan-avance-tms">TMS</label><input id="plan-avance-tms" type="number" step="any" formControlName="tms"  /></div>
<div class="field"><label for="plan-avance-programado">Programado</label><input id="plan-avance-programado" type="text"  formControlName="programado" readonly /></div></div><details class="dynamic-section"><summary><span><i class="pi pi-table" aria-hidden="true"></i>Distribución A / B</span><span class="muted">{{ camposDinamicos.length }} campos</span></summary><div class="dynamic-grid"><div class="field" *ngFor="let campo of camposDinamicos"><label [for]="'dynamic-' + campo">{{ campo }}</label><input [id]="'dynamic-' + campo" type="number" step="any" [formControlName]="campo" /></div></div></details></form></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" [disabled]="!planForm.valid"><i class="pi pi-check" aria-hidden="true"></i>Guardar plan</button></div></div>
