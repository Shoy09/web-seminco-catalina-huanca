<div class="plan-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-arrows-h" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Nuevo plan de metraje</h2><p>Completa la información del plan mensual.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form [formGroup]="planForm"><div class="form-grid plan-fields"><div class="field"><label for="plan-metraje-anio">Año</label><input id="plan-metraje-anio" type="number" step="any" formControlName="anio"  /></div>
<div class="field"><label for="plan-metraje-mes">Mes</label><input id="plan-metraje-mes" type="text"  formControlName="mes"  /></div>
<div class="form-divider">Datos del plan</div><div class="field"><label for="plan-metraje-semana">Semana</label><input id="plan-metraje-semana" type="text"  formControlName="semana"  /></div>
<div class="field"><label for="plan-metraje-mina">Mina</label><input id="plan-metraje-mina" type="text"  formControlName="mina"  /></div>
<div class="field"><label for="plan-metraje-zona">Zona</label><input id="plan-metraje-zona" type="text"  formControlName="zona"  /></div>
<div class="field"><label for="plan-metraje-area">Área</label><input id="plan-metraje-area" type="text"  formControlName="area"  /></div>
<div class="field"><label for="plan-metraje-fase">Fase</label><input id="plan-metraje-fase" type="text"  formControlName="fase"  /></div>
<div class="field"><label for="plan-metraje-minado_tipo">Tipo de Minado</label><input id="plan-metraje-minado_tipo" type="text"  formControlName="minado_tipo"  /></div>
<div class="field"><label for="plan-metraje-tipo_labor">Tipo de Labor</label><input id="plan-metraje-tipo_labor" type="text"  formControlName="tipo_labor"  /></div>
<div class="field"><label for="plan-metraje-tipo_mineral">Tipo de Mineral</label><input id="plan-metraje-tipo_mineral" type="text"  formControlName="tipo_mineral"  /></div>
<div class="field"><label for="plan-metraje-estructura_veta">Estructura/Veta</label><input id="plan-metraje-estructura_veta" type="text"  formControlName="estructura_veta"  /></div>
<div class="field"><label for="plan-metraje-nivel">Nivel</label><input id="plan-metraje-nivel" type="text"  formControlName="nivel"  /></div>
<div class="field"><label for="plan-metraje-block">Block</label><input id="plan-metraje-block" type="text"  formControlName="block"  /></div>
<div class="field"><label for="plan-metraje-labor">Labor</label><input id="plan-metraje-labor" type="text"  formControlName="labor"  /></div>
<div class="field"><label for="plan-metraje-ala">Ala</label><input id="plan-metraje-ala" type="text"  formControlName="ala"  /></div>
<div class="field"><label for="plan-metraje-ancho_veta">Ancho Veta</label><input id="plan-metraje-ancho_veta" type="number" step="any" formControlName="ancho_veta"  /></div>
<div class="field"><label for="plan-metraje-ancho_minado_sem">Ancho Minado (Semana)</label><input id="plan-metraje-ancho_minado_sem" type="number" step="any" formControlName="ancho_minado_sem"  /></div>
<div class="field"><label for="plan-metraje-ancho_minado_mes">Ancho Minado (Mes)</label><input id="plan-metraje-ancho_minado_mes" type="number" step="any" formControlName="ancho_minado_mes"  /></div>
<div class="field"><label for="plan-metraje-burden">Burden</label><input id="plan-metraje-burden" type="number" step="any" formControlName="burden"  /></div>
<div class="field"><label for="plan-metraje-espaciamiento">Espaciamiento</label><input id="plan-metraje-espaciamiento" type="number" step="any" formControlName="espaciamiento"  /></div>
<div class="field"><label for="plan-metraje-longitud_perforacion">Longitud de Perforación</label><input id="plan-metraje-longitud_perforacion" type="number" step="any" formControlName="longitud_perforacion"  /></div>
<div class="field"><label for="plan-metraje-programado">Programado</label><select id="plan-metraje-programado" formControlName="programado"><option value="Programado">Programado</option><option value="No Programado">No Programado</option></select></div></div><details class="dynamic-section"><summary><span><i class="pi pi-table" aria-hidden="true"></i>Distribución A / B</span><span class="muted">{{ camposDinamicos.length }} campos</span></summary><div class="dynamic-grid"><div class="field" *ngFor="let campo of camposDinamicos"><label [for]="'dynamic-' + campo">{{ campo }}</label><input [id]="'dynamic-' + campo" type="number" step="any" [formControlName]="campo" /></div></div></details></form></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" [disabled]="!planForm.valid"><i class="pi pi-check" aria-hidden="true"></i>Guardar plan</button></div></div>
