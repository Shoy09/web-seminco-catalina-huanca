<div class="plan-dialog"><div class="dialog-heading"><span class="heading-icon"><i class="pi pi-arrows-h" aria-hidden="true"></i></span><div><h2 mat-dialog-title>Editar plan de metraje</h2><p>Actualiza los datos del plan mensual.</p></div><button type="button" class="icon-button" (click)="cancelar()" aria-label="Cerrar diálogo"><i class="pi pi-times" aria-hidden="true"></i></button></div><mat-dialog-content class="dialog-body"><form class="form-grid plan-fields"><div class="field"><label for="edit-anio">Año</label><input id="edit-anio" type="number" step="any" [(ngModel)]="plan.anio" name="anio" readonly></div>
<div class="field"><label for="edit-mes">Mes</label><input id="edit-mes" type="text" [(ngModel)]="plan.mes" name="mes" readonly></div>
<div class="field"><label for="edit-semana">Semana</label><input id="edit-semana" type="text" [(ngModel)]="plan.semana" name="semana"></div>
<div class="field"><label for="edit-mina">Mina</label><input id="edit-mina" type="text" [(ngModel)]="plan.mina" name="mina"></div>
<div class="field"><label for="edit-zona">Zona</label><input id="edit-zona" type="text" [(ngModel)]="plan.zona" name="zona"></div>
<div class="field"><label for="edit-area">Área</label><input id="edit-area" type="text" [(ngModel)]="plan.area" name="area"></div>
<div class="field"><label for="edit-fase">Fase</label><input id="edit-fase" type="text" [(ngModel)]="plan.fase" name="fase"></div>
<div class="field"><label for="edit-minado_tipo">Minado Tipo</label><input id="edit-minado_tipo" type="text" [(ngModel)]="plan.minado_tipo" name="minado_tipo"></div>
<div class="field"><label for="edit-tipo_labor">Tipo Labor</label><input id="edit-tipo_labor" type="text" [(ngModel)]="plan.tipo_labor" name="tipo_labor"></div>
<div class="field"><label for="edit-tipo_mineral">Tipo Mineral</label><input id="edit-tipo_mineral" type="text" [(ngModel)]="plan.tipo_mineral" name="tipo_mineral"></div>
<div class="field"><label for="edit-estructura_veta">Estructura Veta</label><input id="edit-estructura_veta" type="text" [(ngModel)]="plan.estructura_veta" name="estructura_veta"></div>
<div class="field"><label for="edit-nivel">Nivel</label><input id="edit-nivel" type="text" [(ngModel)]="plan.nivel" name="nivel"></div>
<div class="field"><label for="edit-block">Block</label><input id="edit-block" type="text" [(ngModel)]="plan.block" name="block"></div>
<div class="field"><label for="edit-labor">Labor</label><input id="edit-labor" type="text" [(ngModel)]="plan.labor" name="labor"></div>
<div class="field"><label for="edit-ala">Ala</label><input id="edit-ala" type="text" [(ngModel)]="plan.ala" name="ala"></div>
<div class="field"><label for="edit-ancho_veta">Ancho Veta</label><input id="edit-ancho_veta" type="number" step="any" [(ngModel)]="plan.ancho_veta" name="ancho_veta"></div>
<div class="field"><label for="edit-ancho_minado_sem">Ancho Minado Semana</label><input id="edit-ancho_minado_sem" type="number" step="any" [(ngModel)]="plan.ancho_minado_sem" name="ancho_minado_sem"></div>
<div class="field"><label for="edit-ancho_minado_mes">Ancho Minado Mes</label><input id="edit-ancho_minado_mes" type="number" step="any" [(ngModel)]="plan.ancho_minado_mes" name="ancho_minado_mes"></div>
<div class="field"><label for="edit-burden">Burden</label><input id="edit-burden" type="number" step="any" [(ngModel)]="plan.burden" name="burden"></div>
<div class="field"><label for="edit-espaciamiento">Espaciamiento</label><input id="edit-espaciamiento" type="number" step="any" [(ngModel)]="plan.espaciamiento" name="espaciamiento"></div>
<div class="field"><label for="edit-longitud_perforacion">Longitud Perforación</label><input id="edit-longitud_perforacion" type="number" step="any" [(ngModel)]="plan.longitud_perforacion" name="longitud_perforacion"></div>
<div class="field"><label for="edit-programado">Programado</label><select id="edit-programado" [(ngModel)]="plan.programado" name="programado">
                    <option value="Programado">Programado</option>
                    <option value="No Programado">No Programado</option>
                </select></div></form></mat-dialog-content><div class="dialog-actions"><button type="button" class="ui-button" (click)="cancelar()">Cancelar</button><button type="button" class="ui-button primary" (click)="guardar()" ><i class="pi pi-check" aria-hidden="true"></i>Guardar plan</button></div></div>
