<div class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-xl p-6">

  <!-- HEADER FIJO -->
  <div class="shrink-0 border-b border-border px-6 py-5">
    <h2 class="text-2xl font-extrabold text-secondary">
      Diferencia entre Plan y Realidad
    </h2>

    <p class="mt-1 text-sm text-ink-75">
      Comparación resumida entre el plan registrado y el avance real.
    </p>
  </div>

  <!-- CONTENIDO CON SCROLL -->
  <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="rounded-2xl border border-border bg-surface-soft p-4">
        <span class="text-xs font-bold uppercase text-ink-75">
          Labor
        </span>

        <p class="mt-1 text-lg font-extrabold text-secondary">
          {{ labor || '-' }}
        </p>
      </div>

      <div class="rounded-2xl border border-border bg-surface-soft p-4">
        <span class="text-xs font-bold uppercase text-ink-75">
          Avance
        </span>

        <p class="mt-1 text-lg font-extrabold text-secondary">
          {{ data.avance_m || 0 }} m
        </p>
      </div>

    </div>

  </div>

  <!-- FOOTER FIJO -->
  <div class="shrink-0 flex justify-end gap-3 border-t border-border px-6 py-4">
    <button
      pButton
      type="button"
      label="Cerrar"
      icon="pi pi-times"
      severity="secondary"
      outlined="true"
      (click)="cerrar()">
    </button>
  </div>

</div>
